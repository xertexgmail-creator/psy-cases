let audioCtx=null;
function initAudio(){ if(audioCtx)return; try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function playTone(freq,dur,type,vol,delay){
    dur=dur||0.1;type=type||'sine';vol=vol||0.15;delay=delay||0;
    if(!soundEnabled||!audioCtx)return;
    if(audioCtx.state==='suspended')audioCtx.resume();
    const t0=audioCtx.currentTime+delay;
    const osc=audioCtx.createOscillator(); const g=audioCtx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(t0); osc.stop(t0+dur);
}

/* ========== ИКОНКИ ЧЕРЕЗ WESERV PROXY ========== */
function iconHTML(item, size){
    size = size || 128;
    const px = size >= 128 ? 500 : 200;
    const originalUrl = 'https://nft.fragment.com/gift/' + item.slug + '.' + px + '.webp';
    const proxied = 'https://images.weserv.nl/?url=' + encodeURIComponent(originalUrl) + '&output=webp&q=85&w=' + size + '&h=' + size + '&fit=contain';
    return '<img src="' + proxied + '" alt="" loading="lazy" onerror="this.style.display=\'none\';">';
}

    });
}

function chanceFromRatio(r){ let c=100/r; if(c>99)c=99; if(c<1)c=1; return Math.round(c*100)/100; }
function chanceLabel(c){ if(c>=60)return 'высокий'; if(c>=30)return 'средний'; if(c>=10)return 'низкий'; return 'безумие'; }

function recomputeChance(){
    if(!currentItem||!targetItem)return;
    const r=targetItem.value/currentItem.value;
    chance=chanceFromRatio(r);
    multiplier=Math.round(r*100)/100;
    updatePercentUI();
}
function updatePercentUI(){
    if(!currentItem||!targetItem)return;
    $('wheel-percent').textContent = chance.toFixed(2).replace(/\.00$/,'')+'%';
    $('wheel-label').textContent = chanceLabel(chance);
    updateArc();
    highlightMult();
}
function highlightMult(){
    document.querySelectorAll('.mult-btn').forEach(b=>{
        b.classList.toggle('active', Math.abs(parseFloat(b.dataset.mult)-multiplier)<0.15);
    });
}
function updateArc(){
    const arc=$('win-arc'); if(!arc) return; const cx=50,cy=50;
    const half=Math.min(179.9,chance*3.6/2);
    const a0=180-half,a1=180+half;
    const rad=d=>d*Math.PI/180;
    const large=(a1-a0)>180?1:0;
    const ro=49,ri=39;
    const p=(r,ang)=>[cx+r*Math.sin(rad(ang)),cy-r*Math.cos(rad(ang))];
    const [xo1,yo1]=p(ro,a0),[xo2,yo2]=p(ro,a1);
    const [xi1,yi1]=p(ri,a0),[xi2,yi2]=p(ri,a1);
    arc.setAttribute('d','M '+xo1+' '+yo1+' A '+ro+' '+ro+' 0 '+large+' 1 '+xo2+' '+yo2+' L '+xi2+' '+yi2+' A '+ri+' '+ri+' 0 '+large+' 0 '+xi1+' '+yi1+' Z');
}

        const rh=JSON.parse(localStorage.getItem(RH_KEY)||'null');

        if(Array.isArray(his))history=his;
        if(bal!==null)balance=parseInt(bal,10)||0;
        if(st)stats={wins:0,losses:0,wagered:0,bestDrop:0,...st};
        if(Array.isArray(rh))rocketHistory=rh;
    }catch{}
}
function hexToRgba(hex,a){
    const h=hex.replace('#','');
    return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';
}

function renderArena(){
    if(currentItem){
        $('from-icon').innerHTML=iconHTML(currentItem,128);
        $('from-name').textContent=currentItem.name;
        $('from-value').textContent=currentItem.value+' ⭐';
        $('from-card').style.setProperty('--slot-glow',hexToRgba(getRarity(currentItem.value),0.35));
    }else{
        $('from-icon').innerHTML='';
        $('from-name').textContent='—'; $('from-value').textContent='—';
        $('from-card').style.setProperty('--slot-glow','transparent');
    }
    if(targetItem){
        $('to-icon').innerHTML=iconHTML(targetItem,128);
        $('to-name').textContent=targetItem.name;
        $('to-value').textContent=targetItem.value+' ⭐';
        $('to-card').style.setProperty('--slot-glow',hexToRgba(getRarity(targetItem.value),0.35));
    }else{
        $('to-icon').innerHTML='';
        $('to-name').textContent='—'; $('to-value').textContent='—';
        $('to-card').style.setProperty('--slot-glow','transparent');
    }
    $('from-card').className='item-slot'; $('to-card').className='item-slot';
}

function renderInventory(){
    const grid=$('inv-grid'); if(!grid) return; grid.innerHTML='';
    $('inv-count').textContent='('+inventory.length+')';
    const list=inventory.filter(it=>{
        if(invSearch&&!it.name.toLowerCase().includes(invSearch.toLowerCase()))return false;
        if(invMin!==null&&it.value<invMin)return false;
        if(invMax!==null&&it.value>invMax)return false;
        return true;
    });
    if(!list.length){ grid.innerHTML='<div class="empty">—</div>'; return; }
    list.forEach(item=>{
        const s=document.createElement('div');
        s.className='slot'+(item===currentItem?' selected':'');
        s.style.setProperty('--rar-color',getRarity(item.value));
        s.innerHTML='<div class="slot-icon-sm">'+iconHTML(item,64)+'</div><div class="slot-name">'+item.name+'</div><div class="slot-price">'+item.value+'⭐</div>';
        s.addEventListener('click', ()=>{
            if(isSpinning)return;
            sndClick();
            currentItem=item;
            if(targetItem&&targetItem.value<=currentItem.value)targetItem=null;
            renderInventory(); renderArena(); renderTargets();
            if(targetItem)recomputeChance();
            updateBtn();
        });
        grid.appendChild(s);
    });
}

function renderTargets(){
    const grid=$('target-grid'); if(!grid) return; grid.innerHTML='';
    if(!currentItem){
        grid.innerHTML='<div class="empty">Сначала выбери свой гифт в инвентаре</div>';
        return;
    }
    const list=CATALOG.filter(it=>{
        if(it.value<=currentItem.value) return false;
        if(targetSearch&&!it.name.toLowerCase().includes(targetSearch.toLowerCase()))return false;
        if(targetMin!==null&&it.value<targetMin)return false;
        if(targetMax!==null&&it.value>targetMax)return false;
        return true;
    });
    if(!list.length){ grid.innerHTML='<div class="empty">—</div>'; return; }
    list.forEach(item=>{
        const s=document.createElement('div');
        s.className='slot'+(targetItem&&targetItem.name===item.name?' selected':'');
        s.style.setProperty('--rar-color',getRarity(item.value));
        s.innerHTML='<div class="slot-icon-sm">'+iconHTML(item,64)+'</div><div class="slot-name">'+item.name+'</div><div class="slot-price">'+item.value+'⭐</div>';
        s.addEventListener('click', ()=>{
            if(isSpinning)return;
            sndClick();
            targetItem={name:item.name, slug:item.slug, value:item.value};
            recomputeChance();
            renderTargets(); renderArena(); updateBtn();
        });
        grid.appendChild(s);
    });
}

function renderShop(){
    const grid=$('shop-grid'); if(!grid) return; grid.innerHTML='';
    const list=CATALOG.filter(it=>{
        if(shopSearch&&!it.name.toLowerCase().includes(shopSearch.toLowerCase()))return false;
        if(shopMin!==null&&it.value<shopMin)return false;
        if(shopMax!==null&&it.value>shopMax)return false;
        return true;
    });
    if(!list.length){ grid.innerHTML='<div class="empty">—</div>'; return; }
    list.forEach(item=>{
        const s=document.createElement('div');
        s.className='slot'+(item.value>balance?' disabled':'');
        s.style.setProperty('--rar-color',getRarity(item.value));
        s.innerHTML='<div class="slot-icon-sm">'+iconHTML(item,64)+'</div><div class="slot-name">'+item.name+'</div><div class="slot-price">'+item.value+'⭐</div>';
        s.addEventListener('click', ()=>{ if(isSpinning)return; sndClick(); openBuy(item); });
        grid.appendChild(s);
    });
}

let buyItem=null;
function openBuy(item){
    buyItem=item;
    $('buy-icon').innerHTML=iconHTML(item,128);
    $('buy-name').textContent=item.name;
    $('buy-price').textContent=item.value+' ⭐';
    $('buy-confirm').disabled=item.value>balance;
    $('buy-modal').classList.add('active');
}
function closeBuy(){ $('buy-modal').classList.remove('active'); buyItem=null; }
$('buy-cancel').addEventListener('click', ()=>{ sndClick(); closeBuy(); });
$('buy-confirm').addEventListener('click', ()=>{
    if(!buyItem||buyItem.value>balance)return;
    balance-=buyItem.value;
    updateBalanceUI();
    inventory.push({name:buyItem.name, slug:buyItem.slug, value:buyItem.value});
    if(!currentItem)currentItem=inventory[inventory.length-1];
    saveState(); sndBuy(); closeBuy();
    renderInventory(); renderArena(); renderTargets(); renderShop(); updateBtn(); checkTestEnd();
    if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
});

function renderMult(){
    const grid=$('mult-grid'); if(!grid) return; grid.innerHTML='';
    MULTIPLIERS.forEach(m=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='mult-btn'; b.dataset.mult=m;
        const c=chanceFromRatio(m);
        b.innerHTML='×'+m+'<span class="c">'+c.toFixed(c<10?1:0)+'%</span>';
        b.addEventListener('click', ()=>{
            if(isSpinning||!currentItem)return;
            sndClick();
            const target=currentItem.value*m;
            const cands=CATALOG.filter(it=>it.value>currentItem.value);
            if(!cands.length)return;
            const best=cands.reduce((p,c2)=>Math.abs(c2.value-target)<Math.abs(p.value-target)?c2:p);
            targetItem={name:best.name, slug:best.slug, value:best.value};
            recomputeChance(); renderTargets(); renderArena(); updateBtn();
        });
        grid.appendChild(b);
    });
}

function updateBtn(){
    const b = $('upgrade-btn'); if(b) b.disabled=isSpinning||!currentItem||!targetItem||testEnded;
}
function checkTestEnd(){
    if(balance<=0&&!testEnded){
        testEnded=true;
        const el=$('test-ended'); if(el) el.style.display='flex';
        updateBtn(); updateSaperButtons();
    } else if(balance>0&&testEnded){
        testEnded=false;
        const el=$('test-ended'); if(el) el.style.display='none';
        updateBtn(); updateSaperButtons();
    }
}

function confetti(){
    const colors=['#fff','#2ecc71','#4a86ff','#a855f7','#ffd93d','#ff4757','#ff9500'];
    const cx=window.innerWidth/2, cy=window.innerHeight/2;
    for(let i=0;i<80;i++){
        const p=document.createElement('div');
        p.style.position='fixed'; p.style.width='7px'; p.style.height='7px';
        p.style.background=colors[Math.floor(Math.random()*colors.length)];
        p.style.left=cx+'px'; p.style.top=cy+'px';
        p.style.borderRadius=Math.random()>0.5?'50%':'2px';
        p.style.pointerEvents='none'; p.style.zIndex=999;
        const a=Math.random()*Math.PI*2;
        const v=180+Math.random()*420;
        const dx=Math.cos(a)*v, dy=Math.sin(a)*v-120;
        p.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate(720deg) scale(0.2)',opacity:0}],{duration:1800,easing:'cubic-bezier(0.15,0.9,0.3,1)',fill:'forwards'});
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),2000);
    }
}
function flashRed(){ const el=$('flash-red'); if(!el) return; el.style.position='fixed'; el.style.inset='0'; el.style.pointerEvents='none'; el.style.zIndex=998; el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
function flashWin(){ const el=$('flash-win'); if(!el) return; el.style.position='fixed'; el.style.inset='0'; el.style.pointerEvents='none'; el.style.zIndex=998; el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }

let hb=null, tickInterval=null;
function startSpin(){
    const s=$('stage');
    s.classList.remove('snap','snap-back');
    requestAnimationFrame(()=>s.classList.add('zooming'));
    $('wheel-wrap').classList.add('spinning');
    sndSpinStart();
    const TICK_START=150,TICK_END=35,EFF=SPIN_DURATION-500;
    let elapsed=0;
    const loop=()=>{
        sndTick();
        elapsed+=TICK_START-(TICK_START-TICK_END)*Math.min(1,elapsed/EFF);
        const prog=Math.min(1,elapsed/EFF);
        const delay=TICK_START-(TICK_START-TICK_END)*prog;
        if(elapsed<EFF)tickInterval=setTimeout(loop,delay);
    };
    loop();
    hb=setInterval(()=>{ if(vibrationEnabled)tg.HapticFeedback?.impactOccurred('light'); },600);
}
function endSpin(win){
    clearInterval(hb); clearTimeout(tickInterval);
    const s=$('stage');
    s.classList.remove('zooming');
    s.classList.add('snap');
    setTimeout(()=>{
        s.classList.remove('snap');
        s.classList.add('snap-back');
        setTimeout(()=>s.classList.remove('snap-back'), 700);
    }, 180);
    $('wheel-wrap').classList.remove('spinning');
    if(vibrationEnabled)tg.HapticFeedback?.impactOccurred('heavy');
    if(win)sndWin(); else sndLose();
}
function spin(ch,predetWin){
    return new Promise(resolve=>{
        const p=$('wheel-pointer');
        const half=Math.min(179.9,ch*3.6/2);
        const s0=180-half,s1=180+half;
        let angle;
        if(predetWin)angle=s0+1+Math.random()*(s1-s0-2);
        else{ const out=360-(s1-s0); let off=1+Math.random()*(out-2); angle=s1+off; if(angle>360)angle-=360; }
        const turns=8+Math.floor(Math.random()*4);
        const total=turns*360+angle;
        p.style.transition='none'; p.style.transform='rotate(0deg)';
        void p.offsetWidth;
        p.style.transition='transform '+SPIN_DURATION+'ms cubic-bezier(0.15,0.7,0.15,1)';
        p.style.transform='rotate('+total+'deg)';
        const fin=((total%360)+360)%360;
        const real=fin>=s0&&fin<=s1;
        setTimeout(()=>resolve(real),SPIN_DURATION+100);
    });
}

async function doUpgrade(){
    if(isSpinning||!currentItem||!targetItem||testEnded)return;
    isSpinning=true;
    $('upgrade-btn').disabled=true;
    $('from-card').className='item-slot'; $('to-card').className='item-slot';

    const wantWin=Math.random()*100<chance;
    const idx=inventory.indexOf(currentItem);
    const fromCopy={...currentItem};
    const toCopy={...targetItem};
    stats.wagered+=fromCopy.value;

    if(wantWin){
        const newItem={name:targetItem.name, slug:targetItem.slug, value:targetItem.value};
        inventory[idx]=newItem;
        currentItem=newItem;
        stats.wins++;
        if(newItem.value>stats.bestDrop)stats.bestDrop=newItem.value;
        history.unshift({win:true,from:fromCopy,to:toCopy,time:Date.now()});
    }else{
        inventory.splice(idx,1);
        currentItem=inventory[0]||null;
        targetItem=null;
        stats.losses++;
        history.unshift({win:false,from:fromCopy,to:null,time:Date.now()});
    }
    history=history.slice(0,50);
    saveState();

    startSpin();
    const win=await spin(chance,wantWin);
    endSpin(win);

    if(win){
        $('to-card').classList.add('win');
        if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
        flashWin(); confetti();
    }else{
        $('to-card').classList.add('lose');
        if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('error');
        flashRed(); shake();
    }

    renderInventory(); renderArena(); renderTargets();
    if(currentItem&&targetItem)recomputeChance();
    else{ chance=50; multiplier=2; if(currentItem)updatePercentUI(); }
    setTimeout(()=>{ isSpinning=false; updateBtn(); checkTestEnd(); },500);
}

function generateCrashPoint(){
    if(Math.random()<0.05)return 1.00;
    const u=Math.random();
    return Math.max(1.00,Math.min(100,(1-0.05)/(1-u)));
}
function multAt(e){ return Math.pow(1.15,e); }

function findGiftInInventory(gift){
    if(!gift)return -1;
    return inventory.findIndex(i => i.name === gift.name && i.value === gift.value);
}

/* Цикл раунда, работает всегда, независимо от экрана */
function rocketCycleTick(){
    const elapsed = (Date.now() - rocketPhaseStart) / 1000;
    const remaining = Math.max(0, rocketPhaseDuration - elapsed);
    setRocketTimer(remaining);

    if(rocketPhase==='waiting'){
        if(remaining<=0){
            // Старт полёта
            rocketPhase='flying';
            rocketPhaseStart=Date.now();
            rocketPhaseDuration=ROCKET_FLY_MAX;
            rocketCrashAt=generateCrashPoint();
            rocketCurrentMult=1;
            rocketStartTime=Date.now();
            if(rocketBetActive && rocketBetGift){
                setRocketIcon(rocketBetGift);
                const ic = $('rocket-icon'); if(ic) ic.style.display='block';
                const m = $('rocket-mult'); if(m) m.className='rocket-mult growing';
                sndRocketStart();
            } else {
                const ic = $('rocket-icon'); if(ic) ic.style.display='none';
            }
            updateRocketButtonLabel();
        }
    } else if(rocketPhase==='flying'){
        const elapsedFly = (Date.now() - rocketStartTime) / 1000;
        const m = multAt(elapsedFly);
        rocketCurrentMult = m;
        if(m >= rocketCrashAt || remaining<=0){
            rocketCurrentMult = Math.min(rocketCrashAt, m);
            renderRocketFrame(rocketCurrentMult);
            endRocketFlight(false);
        } else {
            renderRocketFrame(m);
            if(rocketBetActive) updateRocketButtonLabel();
        }
    } else if(rocketPhase==='result'){
        if(remaining<=0){
            // Начинаем новый приём ставок
            rocketPhase='waiting';
            rocketPhaseStart=Date.now();
            rocketPhaseDuration=ROCKET_WAIT;
            rocketBetActive=false;
            rocketCurrentMult=1;
            resetRocketVisual();
            updateRocketButtonLabel();
        }
    }
}

function renderRocketFrame(m){
    const progress=Math.min(0.95,1-1/m);
    const xPct=5+progress*83;
    const yPct=88-progress*55;
    const iconEl=$('rocket-icon');
    if(iconEl){
        iconEl.style.left=xPct+'%';
        iconEl.style.top=yPct+'%';
    }
    const mult = $('rocket-mult'); if(mult) mult.textContent=m.toFixed(2)+'x';
    const ctrlX=xPct*0.55;
    const ctrlY=88-(progress*55*0.3);
    const path='M 5 88 Q '+ctrlX+' '+ctrlY+' '+xPct+' '+yPct;
    const tp = $('rocket-trail-path'); if(tp) tp.setAttribute('d',path);
}

function endRocketFlight(cashed){
    if(rocketPhase!=='flying') return;
    // Переход в result
    rocketPhase='result';
    rocketPhaseStart=Date.now();
    rocketPhaseDuration=ROCKET_RESULT;

    const mult = $('rocket-mult');
    if(!cashed){
        // Краш
        if(mult){ mult.className='rocket-mult crashed'; mult.textContent=rocketCurrentMult.toFixed(2)+'x'; }
        if(rocketBetActive && rocketBetGift){
            // игрок потерял
            rocketHistory.unshift(rocketCurrentMult);
            rocketHistory=rocketHistory.slice(0,20);
            renderRocketHistory();
            stats.losses++;
            stats.wagered += rocketBetGift.value;
            history.unshift({win:false, from:{name:rocketBetGift.name, value:rocketBetGift.value}, to:null, time:Date.now(), rocket:true});
            history=history.slice(0,50);
            saveState();
            if(vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error');
            flashRed(); shake(); sndLose();
        } else {
            // был в игре но не участвовал — только запись в историю
            rocketHistory.unshift(rocketCurrentMult);
            rocketHistory=rocketHistory.slice(0,20);
            renderRocketHistory();
        }
    }
    rocketBetActive=false;
    updateRocketButtonLabel();
}

function placeRocketBet(){
    if(rocketPhase!=='waiting') return;
    if(rocketBetActive) return;
    if(!rocketBetGift){ sndError(); return; }
    const idx = findGiftInInventory(rocketBetGift);
    if(idx<0){ rocketBetGift=null; updateRocketButtonLabel(); sndError(); return; }
    inventory.splice(idx,1);
    if(currentItem && currentItem.name===rocketBetGift.name && currentItem.value===rocketBetGift.value){
        currentItem=inventory[0]||null;
    }
    rocketBetActive = true;
    saveState();
    renderInventory(); renderArena(); renderTargets();
    updateRocketButtonLabel();
    if(vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    sndBuy();
}

function cashOutRocket(){
    if(rocketPhase!=='flying') return;
    if(!rocketBetActive) return;
    const betValue = rocketBetGift ? rocketBetGift.value : 0;
    const winAmount = Math.floor(betValue * rocketCurrentMult);
    balance += winAmount;
    updateBalanceUI();
    saveState();

    rocketHistory.unshift(rocketCurrentMult);
    rocketHistory=rocketHistory.slice(0,20);
    renderRocketHistory();

    stats.wins++;
    stats.wagered += betValue;
    if(winAmount > stats.bestDrop) stats.bestDrop = winAmount;
    history.unshift({win:true, from:{name:rocketBetGift?.name||'Bet', value:betValue}, to:{name:'Rocket '+rocketCurrentMult.toFixed(2)+'x', value:winAmount}, time:Date.now(), rocket:true});
    history=history.slice(0,50);
    saveState();

    const mult = $('rocket-mult');
    if(mult){ mult.className='rocket-mult cashed'; mult.textContent=rocketCurrentMult.toFixed(2)+'x'; }

    // Переход в result
    rocketPhase='result';
    rocketPhaseStart=Date.now();
    rocketPhaseDuration=ROCKET_RESULT;

    if(vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    flashWin(); confetti(); sndWin();

    rocketBetActive=false;
    updateRocketButtonLabel();
    checkTestEnd();
}

/* ============ САПЁР ============ */
function saperMultiplier(k){
    if(k===0)return 1;
    const N=SAPER_SIZE, M=saperMineCount;
    let mult=1;
    for(let i=0;i<k;i++){
        mult*= (N-i)/(N-M-i);
    }
    return mult*0.95;
}

function updateSaperButtons(){
    const startBtn=$('saper-start-btn'); if(!startBtn) return;
    const cashBtn=$('saper-cash-btn'); if(!cashBtn) return;
    if(saperState==='idle'){
        startBtn.textContent='Старт';
        startBtn.disabled=testEnded||!saperBetGift;
        cashBtn.disabled=true;
        cashBtn.textContent='Забрать';
    }else if(saperState==='playing'){
        startBtn.textContent='Старт';
        startBtn.disabled=true;
        cashBtn.disabled=saperRevealed.size===0;
        const potential=Math.floor((saperBetGift?.value||0)*saperMultiplier(saperRevealed.size));
        cashBtn.textContent='Забрать '+potential+'⭐';
    }else{
        startBtn.textContent='Старт';
        startBtn.disabled=true;
        cashBtn.disabled=true;
    }
    const k=saperRevealed.size;
    $('saper-mult').textContent=saperMultiplier(k).toFixed(2)+'x';
    $('saper-opened').textContent=k+' / '+(SAPER_SIZE-saperMineCount);
    $('saper-mines').textContent=saperMineCount;
    const row=$('saper-bet-row');
    if(saperBetGift){
        row.className='bet-gift-row';
        row.innerHTML='<div class="bet-gift-icon">'+iconHTML(saperBetGift,64)+'</div>'
            +'<div class="bet-gift-info">'
            +'<div class="bet-gift-name">'+saperBetGift.name+'</div>'
            +'<div class="bet-gift-value">'+saperBetGift.value+' ⭐</div>'
            +'</div>'
            +(saperState==='idle'?'<div class="bet-gift-edit">Изменить</div>':'');
    }else{
        row.className='bet-gift-row empty-bet';
        row.innerHTML='<div class="bg-label">Нажми чтобы выбрать гифт</div>';
    }
}

function renderSaperGrid(){
    const grid=$('saper-grid'); if(!grid) return; grid.innerHTML='';
    for(let i=0;i<SAPER_SIZE;i++){
        const cell=document.createElement('div');
        cell.className='saper-cell';
        cell.dataset.idx=i;
        const isMine=saperMines.includes(i);
        const revealed=saperRevealed.has(i);
        if(revealed){
            cell.classList.add('revealed');
        }else if(saperState==='ended'){
            cell.classList.add('disabled');
            if(isMine){
                cell.classList.add('mine-reveal');
            }
        }
        cell.addEventListener('click', ()=>clickSaperCell(i));
        grid.appendChild(cell);
    }
}

function clickSaperCell(i){
    if(saperState!=='playing')return;
    if(saperRevealed.has(i))return;
    const cell=$('saper-grid').children[i];
    if(saperMines.includes(i)){
        saperState='ended';
        cell.classList.add('mine');
        sndLose();
        if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('error');
        flashRed(); shake();
        stats.losses++;
        stats.wagered+=saperBetGift?saperBetGift.value:0;
        history.unshift({win:false,from:{name:saperBetGift?.name||'Saper',value:saperBetGift?.value||0},to:null,time:Date.now(),saper:true});
        history=history.slice(0,50);
        saperBetGift=null;
        saveState();
        renderSaperGrid();
        updateSaperButtons();
        setTimeout(()=>{ resetSaperUI(); checkTestEnd(); },2000);
    }else{
        saperRevealed.add(i);
        cell.classList.add('revealed');
        sndCellOpen();
        if(vibrationEnabled)tg.HapticFeedback?.impactOccurred('light');
        updateSaperButtons();
        if(saperRevealed.size===SAPER_SIZE-saperMineCount){
            setTimeout(()=>cashOutSaper(),300);
        }
    }
}

function startSaper(){
    if(saperState==='playing'||testEnded)return;
    if(!saperBetGift){ sndError(); return; }
    const idx=findGiftInInventory(saperBetGift);
    if(idx<0){ saperBetGift=null; updateSaperButtons(); sndError(); return; }
    inventory.splice(idx,1);
    if(currentItem && currentItem.name===saperBetGift.name && currentItem.value===saperBetGift.value){
        currentItem=inventory[0]||null;
    }
    saveState();
    renderInventory(); renderArena(); renderTargets(); updateBtn();
    saperMines=[];
    while(saperMines.length<saperMineCount){
        const r=Math.floor(Math.random()*SAPER_SIZE);
        if(!saperMines.includes(r))saperMines.push(r);
    }
    saperRevealed=new Set();
    saperState='playing';
    renderSaperGrid();
    updateSaperButtons();
    sndRocketStart();
}

function cashOutSaper(){
    if(saperState!=='playing')return;
    if(saperRevealed.size===0)return;
    const mult=saperMultiplier(saperRevealed.size);
    const betValue=saperBetGift?saperBetGift.value:0;
    const winAmount=Math.floor(betValue*mult);
    balance=balance+winAmount;
    updateBalanceUI();
    saveState();
    stats.wins++;
    stats.wagered+=betValue;
    if(winAmount>stats.bestDrop)stats.bestDrop=winAmount;
    history.unshift({win:true,from:{name:saperBetGift?.name||'Bet',value:betValue},to:{name:'Saper '+mult.toFixed(2)+'x',value:winAmount},time:Date.now(),saper:true});
    history=history.slice(0,50);
    saveState();
    saperState='ended';
    sndWin();
    if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
    flashWin(); confetti();
    renderSaperGrid();
    updateSaperButtons();
    saperBetGift=null;
    setTimeout(()=>{ resetSaperUI(); checkTestEnd(); },2000);
}

function resetSaperUI(){
    saperState='idle';
    saperMines=[];
    saperRevealed=new Set();
    saperBetGift=null;
    renderSaperGrid();
    updateSaperButtons();
}

$('promo-activate').addEventListener('click', ()=>{
    const code=$('promo-input').value.trim().toUpperCase();
    const msg=$('promo-message'); msg.className='status-msg';
    if(!code){ msg.textContent='Введи промокод'; msg.classList.add('err'); sndError(); return; }
    const promo=PROMO_CODES[code];
    if(!promo){ msg.textContent='Неверный промокод'; msg.classList.add('err'); sndError(); return; }
    if(isCodeUsed(code)){ msg.textContent='Уже активирован'; msg.classList.add('err'); sndError(); return; }
    balance=balance+promo;
    updateBalanceUI();
    markCodeUsed(code); saveState();
    msg.textContent='+'+promo+' ⭐'; msg.classList.add('ok');
    sndPromo(); if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
    confetti(); renderShop(); updateBtn(); checkTestEnd();
    setTimeout(()=>$('promo-modal').classList.remove('active'),1200);
});

function renderHistory(){
    const el=$('history-list'); if(!el) return;
    if(!history.length){ el.innerHTML='<div class="empty">—</div>'; return; }
    el.innerHTML=history.slice(0,30).map(h=>{
        const tm=new Date(h.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
        const item = h.win && h.to ? h.to : h.from;
        let ic = '';
        if(item && item.name){
            const catItem = CATALOG.find(i=>i.name===item.name);
            if(catItem) ic = iconHTML(catItem,64);
        }
        const name=h.win?(h.to?.name||'—'):(h.from?.name||'—');
        const sub=h.win?('+'+(h.to?.value||0)-(h.from?.value||0)):('-'+(h.from?.value||0));
        return '<div class="history-item">'
            +'<div class="history-icon">'+ic+'</div>'
            +'<div class="history-info">'
            +'<div class="history-name">'+name+'</div>'
            +'<div class="history-sub">'+sub+' ⭐ · '+tm+'</div>'
            +'</div>'
            +'<div class="history-result '+(h.win?'win':'lose')+'">'+(h.win?'WIN':'LOSE')+'</div>'
            +'</div>';
    }).join('');
}

function renderProfileInventory(){
    const el=$('profile-inv-list'); if(!el) return;
    if(!inventory.length){ el.innerHTML='<div class="empty">—</div>'; return; }
    el.innerHTML=inventory.map((item,idx)=>{
        return '<div class="inv-item">'
            +'<div class="history-icon">'+iconHTML(item,64)+'</div>'
            +'<div class="history-info">'
            +'<div class="history-name">'+item.name+'</div>'
            +'<div class="history-sub">'+item.value+' ⭐</div>'
            +'</div>'
            +'<div class="inv-actions">'
            +'<button class="mini-btn sell" data-sell="'+idx+'" type="button">Продать</button>'
            +'<button class="mini-btn withdraw" type="button" disabled>Вывод</button>'
            +'</div>'
            +'</div>';
    }).join('');
    el.querySelectorAll('[data-sell]').forEach(btn=>{
        btn.addEventListener('click', ()=>{ const idx=parseInt(btn.dataset.sell,10); sndClick(); openSell(idx); });
    });
}

let sellIdx=-1;
function openSell(idx){
    const item=inventory[idx];
    if(!item)return;
    sellIdx=idx;
    $('sell-icon').innerHTML=iconHTML(item,128);
    $('sell-name').textContent=item.name;
    const price=item.value;
    $('sell-info').innerHTML='Продать за <b style="color:var(--gold)">'+price+' ⭐</b>';
    $('sell-modal').classList.add('active');
}
$('sell-cancel').addEventListener('click', ()=>{ sndClick(); $('sell-modal').classList.remove('active'); sellIdx=-1; });
$('sell-confirm').addEventListener('click', ()=>{
    if(sellIdx<0)return;
    const item=inventory[sellIdx];
    const price=item.value;
    balance=balance+price;
    updateBalanceUI();
    if(currentItem===item)currentItem=null;
    inventory.splice(sellIdx,1);
    saveState(); sndBuy();
    $('sell-modal').classList.remove('active'); sellIdx=-1;
    renderInventory(); renderArena(); renderTargets(); renderShop(); updateBtn();
    renderProfileInventory();
    if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
});

function setupAdminPanel(){
    const admin=isAdmin();
    const chip=$('plus-btn');
    const sign=$('plus-sign');
    if(admin){
        chip.classList.add('admin');
        sign.style.display='inline';
        chip.addEventListener('click', ()=>{
            sndClick();
            const input=prompt('Сколько монет добавить?','10000');
            if(!input)return;
            const amt=parseInt(input,10);
            if(isNaN(amt)||amt<=0)return;
            balance=balance+amt;
            updateBalanceUI();
            saveState(); renderShop(); checkTestEnd();
            if(vibrationEnabled)tg.HapticFeedback?.notificationOccurred('success');
        });
    }else{
        chip.classList.remove('admin');
        sign.style.display='none';
    }
}

function startOnlineLoop(){
    const el=$('online-count'); if(!el) return;
    const update=()=>{ el.textContent=3+Math.floor(Math.random()*14); };
    update();
    setInterval(update,3000+Math.random()*4000);
}

async function init(){
    CATALOG=[...FALLBACK];
    loadState();
    if(isNaN(balance)||balance<0)balance=0;
    const isFirstLaunch=!localStorage.getItem(INIT_KEY);
    if(isFirstLaunch){
        const pool=CATALOG.slice(0,Math.min(12,CATALOG.length));
        for(let i=0;i<8;i++){
            const p = pool[Math.floor(Math.random()*pool.length)];
            inventory.push({name:p.name, slug:p.slug, value:p.value});
        }
        balance=STARTING_BALANCE;
        localStorage.setItem(INIT_KEY,'1');
    }
    saveState();
    updateBalanceUI();
    if(balance<=0){ testEnded=true; const el=$('test-ended'); if(el) el.style.display='flex'; }
    currentItem=inventory[0]||null;
    targetItem=null;
    chance=50; multiplier=2;
    fillMenuIcons();
    renderMult(); renderInventory(); renderArena(); renderTargets(); renderShop();
    updatePercentUI(); updateBtn();
    setupAdminPanel();
    startOnlineLoop();
    renderRocketHistory();
    resetSaperUI();
    updateLogo();

    // 🚀 Запуск автоцикла ракеты
    rocketPhase='waiting';
    rocketPhaseStart=Date.now();
    rocketPhaseDuration=ROCKET_WAIT;
    rocketBetActive=false;
    rocketBetGift=null;
    resetRocketVisual();
    updateRocketButtonLabel();
    setInterval(rocketCycleTick, 200);
}

init();

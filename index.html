<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSY GIFTS UPGRADER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at top, #1e1e3f 0%, #0d0d1f 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px;
        }
        .logo {
            font-size: 18px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #4a86ff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .balance {
            background: rgba(74, 134, 255, 0.15);
            border: 1px solid rgba(74, 134, 255, 0.4);
            padding: 6px 14px; border-radius: 20px;
            font-size: 14px; font-weight: 600;
        }

        /* ===== ЗОНА С ПРЕДМЕТАМИ И КОЛЕСОМ ===== */
        .arena {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
        }

        .item-slot {
            background: linear-gradient(145deg, #1a1a35, #12122a);
            border-radius: 16px; padding: 14px 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            min-height: 120px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .item-slot.win { border-color: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.4); }
        .item-slot.lose { border-color: #ef4444; box-shadow: 0 0 25px rgba(239,68,68,0.4); }

        .item-emoji { font-size: 40px; display: block; margin-bottom: 6px; }
        .item-name { font-size: 12px; color: #a0a0c0; margin-bottom: 4px; }
        .item-value { font-size: 15px; font-weight: 700; color: #4a86ff; }

        /* ===== КОЛЕСО ===== */
        .wheel-wrap {
            position: relative;
            width: 110px; height: 110px;
            display: flex; align-items: center; justify-content: center;
        }
        .wheel-circle {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #22c55e 0deg 180deg,
                #ef4444 180deg 360deg
            );
            position: relative;
            box-shadow: 0 0 25px rgba(74,134,255,0.3);
        }
        .wheel-circle::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: #12122a;
        }
        .wheel-pointer {
            position: absolute;
            top: 50%; left: 50%;
            transform-origin: center;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 100%; height: 100%;
            pointer-events: none;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel-pointer::before {
            content: '▲';
            position: absolute;
            top: -14px; left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 8px #4a86ff;
        }
        .wheel-center {
            position: absolute;
            z-index: 5;
            font-size: 13px; font-weight: 800;
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ===== БЛОК МНОЖИТЕЛЯ ===== */
        .multiplier-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px; padding: 14px; margin-bottom: 14px;
        }
        .section-label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: #8080a0; margin-bottom: 10px;
        }
        .multiplier-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        }
        .mult-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px 4px;
            border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .mult-btn.active {
            background: linear-gradient(135deg, #4a86ff, #a855f7);
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(74,134,255,0.5);
        }
        .mult-btn .chance {
            display: block; font-size: 9px;
            color: #a0a0c0; font-weight: 400; margin-top: 2px;
        }
        .mult-btn.active .chance { color: rgba(255,255,255,0.85); }

        .action-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #4a86ff, #a855f7);
            border: none; border-radius: 16px;
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; letter-spacing: 0.5px;
            box-shadow: 0 8px 30px rgba(74,134,255,0.4);
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { opacity: 0.5; }

        /* ===== ИСТОРИЯ ===== */
        .history { margin-top: 18px; }
        .history-title {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: #8080a0; margin-bottom: 8px;
        }
        .history-item {
            display: flex; justify-content: space-between;
            padding: 9px 12px; background: rgba(255,255,255,0.03);
            border-radius: 10px; margin-bottom: 5px;
            font-size: 12px;
        }
        .history-item .win-text { color: #22c55e; }
        .history-item .lose-text { color: #ef4444; }

        /* ===== СПИСКИ ГИФТОВ ===== */
        .gifts-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-top: 14px;
        }
        .gifts-block {
            background: rgba(255,255,255,0.03);
            border-radius: 14px; padding: 10px;
            max-height: 160px; overflow-y: auto;
        }
        .gifts-block h4 {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; color: #8080a0; margin-bottom: 8px;
        }
        .gift-chip {
            display: flex; justify-content: space-between;
            padding: 6px 8px; border-radius: 8px;
            font-size: 11px; margin-bottom: 4px;
            background: rgba(255,255,255,0.04);
        }
        .gift-chip .gval { color: #4a86ff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">PSY GIFTS UPGRADER</div>
        <div class="balance">💰 <span id="balance">1000</span></div>
    </div>

    <!-- АРЕНА: слева предмет, по центру колесо, справа цель -->
    <div class="arena">
        <div class="item-slot" id="from-card">
            <span class="item-emoji" id="from-emoji">🎁</span>
            <div class="item-name" id="from-name">—</div>
            <div class="item-value" id="from-value">—</div>
        </div>

        <div class="wheel-wrap">
            <div class="wheel-circle"></div>
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center" id="wheel-center">ДА<br>НЕТ</div>
        </div>

        <div class="item-slot" id="to-card">
            <span class="item-emoji" id="to-emoji">❓</span>
            <div class="item-name">Результат</div>
            <div class="item-value" id="to-value">—</div>
        </div>
    </div>

    <div class="multiplier-section">
        <div class="section-label">Множитель</div>
        <div class="multiplier-grid" id="mult-grid"></div>
    </div>

    <button class="action-btn" id="upgrade-btn">АПГРЕЙД</button>

    <!-- Списки гифтов -->
    <div class="gifts-row">
        <div class="gifts-block">
            <h4>У тебя сейчас</h4>
            <div id="my-gifts"></div>
        </div>
        <div class="gifts-block">
            <h4>Твои цели</h4>
            <div id="target-gifts"></div>
        </div>
    </div>

    <div class="history">
        <div class="history-title">История</div>
        <div id="history-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ====== ГИФТЫ TELEGRAM (популярные, с приблизительной ценой в Stars) ======
        const ITEMS = [
            { emoji: '❤️', name: 'Heart',        value: 15    },
            { emoji: '🧸', name: 'Teddy Bear',   value: 15    },
            { emoji: '🎁', name: 'Present',      value: 25    },
            { emoji: '🌹', name: 'Rose',         value: 25    },
            { emoji: '🎂', name: 'Cake',         value: 50    },
            { emoji: '💐', name: 'Bouquet',      value: 50    },
            { emoji: '🚀', name: 'Rocket',       value: 50    },
            { emoji: '🍾', name: 'Champagne',    value: 50    },
            { emoji: '🏆', name: 'Trophy',       value: 100   },
            { emoji: '👑', name: 'Crown',        value: 100   },
            { emoji: '💍', name: 'Ring',         value: 100   },
            { emoji: '💎', name: 'Diamond',      value: 100   },
            { emoji: '🔥', name: 'Jolly Chimp',  value: 250   },
            { emoji: '🐸', name: 'Plush Pepe',   value: 500   },
            { emoji: '🐶', name: 'Snoop Dogg',   value: 1000  },
            { emoji: '🎩', name: 'Papakha',      value: 2500  }
        ];

        // ====== МНОЖИТЕЛИ (чем выше — тем ниже шанс) ======
        const MULTIPLIERS = [
            { mult: 1.2, chance: 80 },
            { mult: 1.5, chance: 65 },
            { mult: 2.0, chance: 50 },
            { mult: 3.0, chance: 33 },
            { mult: 5.0, chance: 20 },
            { mult: 10,  chance: 10 },
            { mult: 25,  chance: 4  },
            { mult: 100, chance: 1  }
        ];

        let balance = 1000;
        let currentItem = ITEMS[1];
        let currentMult = MULTIPLIERS[1];
        let isSpinning = false;

        const $ = id => document.getElementById(id);

        // ====== UI: множители ======
        function renderMultipliers() {
            const grid = $('mult-grid');
            grid.innerHTML = '';
            MULTIPLIERS.forEach((m, i) => {
                const btn = document.createElement('button');
                btn.className = 'mult-btn' + (i === 1 ? ' active' : '');
                btn.innerHTML = `×${m.mult}<span class="chance">${m.chance}%</span>`;
                btn.onclick = () => {
                    if (isSpinning) return;
                    document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMult = m;
                    updatePreview();
                };
                grid.appendChild(btn);
            });
        }

        function updatePreview() {
            const targetValue = Math.round(currentItem.value * currentMult.mult);
            $('to-value').textContent = `~${targetValue} ⭐`;
            $('to-emoji').textContent = '❓';
            $('to-card').className = 'item-slot';
        }

        function updateFromCard() {
            $('from-emoji').textContent = currentItem.emoji;
            $('from-name').textContent = currentItem.name;
            $('from-value').textContent = currentItem.value + ' ⭐';
            updatePreview();
        }

        function selectRandomItem() {
            const pool = ITEMS.slice(0, ITEMS.length - 4); // без топовых
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // ====== ЛОГИКА КОЛЕСА ======
        function spinWheel(chance) {
            return new Promise(resolve => {
                const pointer = $('wheel-pointer');
                // Крутим на несколько оборотов
                const extraTurns = 3 + Math.floor(Math.random() * 2);
                const finalAngle = Math.random() * 360;

                pointer.style.transition = 'none';
                pointer.style.transform = `translate(-50%, -50%) rotate(0deg)`;

                // force reflow
                void pointer.offsetWidth;

                pointer.style.transition = 'transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
                pointer.style.transform = `translate(-50%, -50%) rotate(${extraTurns * 360 + finalAngle}deg)`;

                setTimeout(() => {
                    // Стрелка указывает на верх колеса (0deg = верх).
                    // Верх — это грань между секторами. Считаем, куда попали.
                    const normalized = (360 - finalAngle) % 360;
                    const isWin = normalized < (360 * (chance / 100));
                    resolve(isWin);
                }, 3100);
            });
        }

        // ====== АПГРЕЙД ======
        async function doUpgrade() {
            if (isSpinning) return;

            isSpinning = true;
            $('upgrade-btn').disabled = true;
            $('to-card').className = 'item-slot';

            const targetValue = Math.round(currentItem.value * currentMult.mult);
            const win = await spinWheel(currentMult.chance);

            if (win) {
                const newItem = ITEMS.reduce((prev, curr) =>
                    Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
                );

                $('to-emoji').textContent = newItem.emoji;
                $('to-value').textContent = newItem.value + ' ⭐';
                $('to-card').classList.add('win');

                tg.HapticFeedback?.notificationOccurred('success');
                addHistory(true, `${currentItem.name} → ${newItem.name}`);

                currentItem = newItem;
            } else {
                $('to-emoji').textContent = '💥';
                $('to-value').textContent = 'Провал';
                $('to-card').classList.add('lose');

                tg.HapticFeedback?.notificationOccurred('error');
                addHistory(false, `${currentItem.name} → провал`);

                balance = Math.max(0, balance - currentItem.value);
                $('balance').textContent = balance;
                currentItem = selectRandomItem();
            }

            renderGiftLists();

            setTimeout(() => {
                updateFromCard();
                isSpinning = false;
                $('upgrade-btn').disabled = false;
            }, 900);
        }

        // ====== ИСТОРИЯ ======
        function addHistory(win, text) {
            const list = $('history-list');
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span>${text}</span><span class="${win ? 'win-text' : 'lose-text'}">${win ? '✅' : '❌'}</span>`;
            list.prepend(div);
            if (list.children.length > 8) list.removeChild(list.lastChild);
        }

        // ====== СПИСКИ ГИФТОВ ВНИЗУ ======
        function renderGiftLists() {
            // Слева — "у тебя сейчас" (текущий + пара соседей)
            const my = $('my-gifts');
            my.innerHTML = '';
            const myPool = ITEMS.slice(Math.max(0, ITEMS.indexOf(currentItem) - 2), ITEMS.indexOf(currentItem) + 3);
            myPool.forEach(it => {
                const div = document.createElement('div');
                div.className = 'gift-chip';
                div.innerHTML = `<span>${it.emoji} ${it.name}</span><span class="gval">${it.value}⭐</span>`;
                my.appendChild(div);
            });

            // Справа — цели (следующие по цене)
            const target = $('target-gifts');
            target.innerHTML = '';
            const idx = ITEMS.indexOf(currentItem);
            const targets = ITEMS.slice(idx + 1, idx + 6);
            targets.forEach(it => {
                const div = document.createElement('div');
                div.className = 'gift-chip';
                div.innerHTML = `<span>${it.emoji} ${it.name}</span><span class="gval">${it.value}⭐</span>`;
                target.appendChild(div);
            });
        }

        // ====== СТАРТ ======
        currentItem = ITEMS[7];
        renderMultipliers();
        updateFromCard();
        renderGiftLists();
        $('upgrade-btn').onclick = doUpgrade;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПСЫ.gg — Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
        --bg: #0a0a0c;
        --bg-elevated: #14141a;
        --bg-hover: #1c1c24;
        --border: rgba(255, 255, 255, 0.06);
        --border-strong: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7;
        --text-dim: #8a8a95;
        --text-mute: #55555f;
        --accent: #ffffff;
        --green: #2ecc71;
        --red: #ff4757;
        --gold: #ffd93d;
    }

    html, body { overflow-x: hidden; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        padding: 8px;
        min-height: 100vh;
        position: relative;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
        display: flex;
        flex-direction: column;
    }

    body::before {
        content: '';
        position: fixed;
        top: -40%; left: 50%;
        transform: translateX(-50%);
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(120, 100, 255, 0.08) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    .stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 16px);
        transform-origin: 50% 40%;
        transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        will-change: transform;
    }
    .stage.zooming {
        transform: scale(1.05);
        transition: transform 6s cubic-bezier(0.25, 0.1, 0.3, 1);
    }
    .stage.tension { animation: tensionShake 0.15s ease-in-out infinite; }
    @keyframes tensionShake {
        0%, 100% { transform: scale(1.05) translate(0, 0); }
        25% { transform: scale(1.05) translate(-1px, 1px); }
        50% { transform: scale(1.05) translate(1px, -1px); }
        75% { transform: scale(1.05) translate(-1px, -1px); }
    }
    .stage.snap { animation: snapBack 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes snapBack {
        0% { transform: scale(1.05); }
        40% { transform: scale(0.96); }
        100% { transform: scale(1); }
    }

    /* ХЕДЕР */
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--bg-elevated);
        border-radius: 14px;
        border: 1px solid var(--border);
        margin-bottom: 8px;
        flex-shrink: 0;
        gap: 6px;
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; flex-shrink: 0; }
    .logo .dot { color: var(--text-mute); }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-btn {
        width: 34px; height: 34px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
        padding: 0;
    }
    .icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn svg { width: 16px; height: 16px; }

    .balance-chip {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--accent);
        color: #000;
        padding: 6px 11px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.02em;
        cursor: pointer;
        transition: transform 0.15s;
    }
    .balance-chip:active { transform: scale(0.95); }
    .balance-chip svg { width: 12px; height: 12px; }

    /* АРЕНА */
    .arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 6px;
        align-items: stretch;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .item-slot {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 6px 10px;
        text-align: center;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .item-slot.win {
        border-color: rgba(46, 204, 113, 0.5);
        box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
    }
    .item-slot.lose {
        border-color: rgba(255, 71, 87, 0.5);
        box-shadow: 0 0 20px rgba(255, 71, 87, 0.15);
    }
    .slot-title {
        position: absolute;
        top: 8px; left: 0; right: 0;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--text-mute);
        text-transform: uppercase;
    }
    .slot-icon {
        width: 64px; height: 64px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .slot-icon img {
        width: 100%; height: 100%;
        object-fit: contain;
        animation: floaty 4s ease-in-out infinite;
    }
    @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
    }
    .item-name {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-dim);
        margin-bottom: 2px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .item-value {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
    }

    /* КОЛЕСО */
    .wheel-col {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        position: relative;
    }
    .wheel-wrap {
        position: relative;
        width: 150px;
        height: 150px;
        transition: filter 0.4s;
    }
    .wheel-wrap.spinning {
        filter: drop-shadow(0 0 20px rgba(120, 100, 255, 0.6));
    }
    .wheel-svg { width: 100%; height: 100%; }
    .wheel-pointer {
        position: absolute;
        inset: 0;
        transition: transform 7.5s cubic-bezier(0.15, 0.7, 0.15, 1);
        will-change: transform;
    }
    .wheel-pointer::before {
        content: '';
        position: absolute;
        top: -2px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 10px solid var(--text);
    }
    .wheel-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 88px; height: 88px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--border-strong);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 3;
    }
    .wheel-percent {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
    }
    .wheel-label {
        font-size: 7px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-mute);
        text-transform: uppercase;
        margin-top: 3px;
    }

    /* МНОЖИТЕЛИ */
    .mult-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .mult-btn {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 0;
        border-radius: 8px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: -0.02em;
        cursor: pointer;
        transition: all 0.15s ease;
        line-height: 1;
    }
    .mult-btn:hover { border-color: var(--border-strong); }
    .mult-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .mult-btn .c {
        display: block;
        font-size: 6px;
        color: var(--text-mute);
        font-weight: 500;
        margin-top: 2px;
    }
    .mult-btn.active .c { color: rgba(0, 0, 0, 0.55); }

    /* КНОПКА АПГРЕЙДА */
    .upgrade-btn {
        width: 60%;
        margin: 0 auto 8px;
        padding: 12px;
        background: var(--accent);
        border: none;
        border-radius: 12px;
        color: #000;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
        font-family: inherit;
    }
    .upgrade-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15); }
    .upgrade-btn:active { transform: scale(0.97); }
    .upgrade-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ТАБЫ */
    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .tab {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 9px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
        text-transform: uppercase;
    }
    .tab.active { background: var(--bg-elevated); color: var(--text); border-color: var(--border-strong); }

    /* ПАНЕЛЬ */
    .panel {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 200px;
        max-height: 340px;
        overflow: hidden;
    }
    .panel-view { display: none; flex-direction: column; height: 100%; }
    .panel-view.active { display: flex; }

    .panel-tools {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr;
        gap: 5px;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .search-box {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 9px;
        transition: border-color 0.15s;
    }
    .search-box:focus-within { border-color: var(--border-strong); }
    .search-box svg { width: 10px; height: 10px; color: var(--text-mute); flex-shrink: 0; }
    .search-box input {
        background: transparent; border: none; color: var(--text);
        font-size: 11px; font-family: inherit; width: 100%;
        outline: none; min-width: 0;
    }
    .search-box input::placeholder { color: var(--text-mute); }

    .num-input {
        background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
        color: var(--text); font-size: 11px; font-family: inherit; padding: 6px;
        width: 100%; min-width: 0; outline: none; text-align: center;
        transition: border-color 0.15s;
    }
    .num-input:focus { border-color: var(--border-strong); }
    .num-input::placeholder { color: var(--text-mute); }

    .items-scroll {
        flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .items-scroll::-webkit-scrollbar { width: 3px; }
    .items-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .item-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
    }
    .slot {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px 3px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
        position: relative;
        overflow: hidden;
    }
    .slot:hover { border-color: var(--border-strong); }
    .slot:active { transform: scale(0.95); }
    .slot.selected { border-color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .slot.disabled { opacity: 0.25; pointer-events: none; }
    .slot-icon-sm {
        width: 34px; height: 34px;
        margin: 0 auto 3px;
        display: flex; align-items: center; justify-content: center;
    }
    .slot-icon-sm img { width: 100%; height: 100%; object-fit: contain; }
    .slot-name {
        font-size: 7px; color: var(--text-dim);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-weight: 500;
    }
    .slot-price {
        font-size: 8px; font-weight: 700; color: var(--text);
        margin-top: 1px; letter-spacing: -0.02em;
    }
    .empty {
        grid-column: 1 / -1; text-align: center; color: var(--text-mute);
        font-size: 11px; padding: 24px 8px;
    }

    /* МОДАЛКИ */
    .overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center;
        z-index: 200; padding: 20px;
    }
    .overlay.active { display: flex; }
    .modal {
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 18px;
        padding: 20px;
        max-width: 300px; width: 100%;
        animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-height: 80vh; overflow-y: auto;
        scrollbar-width: thin;
    }
    @keyframes modalIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
        font-size: 14px; font-weight: 700;
        letter-spacing: -0.02em; margin-bottom: 14px;
        text-align: center;
    }
    .modal-sub {
        font-size: 11px; color: var(--text-dim);
        text-align: center; margin-bottom: 14px; line-height: 1.4;
    }
    .input-field {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        font-weight: 600;
        padding: 11px 12px;
        text-align: center;
        letter-spacing: 0.05em;
        outline: none;
        transition: border-color 0.15s;
        text-transform: uppercase;
        margin-bottom: 10px;
    }
    .input-field:focus { border-color: var(--text); }
    .input-field::placeholder {
        color: var(--text-mute); font-weight: 400;
        text-transform: none; letter-spacing: 0;
    }
    .status-msg {
        font-size: 11px; font-weight: 600;
        min-height: 16px; text-align: center; margin-bottom: 12px;
    }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }

    .btns-row { display: flex; gap: 8px; }
    .btn {
        flex: 1; padding: 11px; border-radius: 10px;
        border: none; font-size: 12px; font-weight: 700;
        font-family: inherit; cursor: pointer;
        transition: transform 0.1s; letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Настройки */
    .settings-row {
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 12px; color: var(--text); font-weight: 500; }

    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
        position: absolute; inset: 0;
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: 11px; cursor: pointer; transition: 0.25s;
    }
    .switch .slider::before {
        content: ''; position: absolute;
        width: 16px; height: 16px;
        left: 2px; top: 2px;
        background: var(--text-dim);
        border-radius: 50%; transition: 0.25s;
    }
    .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); background: #000; }

    /* Профиль */
    .profile-header {
        display: flex; align-items: center; gap: 12px;
        padding-bottom: 14px; border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
    }
    .avatar {
        width: 46px; height: 46px; border-radius: 50%;
        background: var(--bg); border: 1px solid var(--border-strong);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; font-size: 18px; font-weight: 800;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
        font-size: 14px; font-weight: 700; margin-bottom: 2px;
        letter-spacing: -0.02em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-stats { font-size: 10px; color: var(--text-dim); }

    .profile-tabs {
        display: flex; gap: 4px;
        background: var(--bg); border-radius: 9px;
        padding: 3px; margin-bottom: 12px;
    }
    .profile-tab {
        flex: 1; padding: 7px; border-radius: 7px;
        background: transparent; border: none;
        color: var(--text-dim); font-size: 10px;
        font-weight: 600; font-family: inherit;
        cursor: pointer; transition: all 0.15s;
        text-transform: uppercase;
    }
    .profile-tab.active { background: var(--bg-elevated); color: var(--text); }

    .profile-view { display: none; max-height: 240px; overflow-y: auto; scrollbar-width: thin; }
    .profile-view.active { display: block; }

    .history-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 4px; border-bottom: 1px solid var(--border);
        font-size: 11px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-icon {
        width: 32px; height: 32px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
    }
    .history-icon img { width: 100%; height: 100%; object-fit: contain; }
    .history-info { flex: 1; min-width: 0; }
    .history-name {
        font-weight: 600; color: var(--text);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .history-sub { font-size: 9px; color: var(--text-mute); margin-top: 1px; }
    .history-result { font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .history-result.win { color: var(--green); }
    .history-result.lose { color: var(--red); }

    .inv-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 4px; border-bottom: 1px solid var(--border);
    }
    .inv-item:last-child { border-bottom: none; }
    .inv-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .mini-btn {
        padding: 5px 9px; border-radius: 7px;
        border: 1px solid var(--border);
        background: transparent; color: var(--text);
        font-size: 9px; font-weight: 700;
        font-family: inherit; cursor: pointer;
        transition: all 0.15s; white-space: nowrap;
    }
    .mini-btn:hover { border-color: var(--border-strong); }
    .mini-btn:active { transform: scale(0.94); }
    .mini-btn.sell { color: var(--gold); border-color: rgba(255, 217, 61, 0.3); }
    .mini-btn.sell:hover { border-color: var(--gold); }
    .mini-btn.withdraw { color: var(--text-mute); cursor: not-allowed; }
    .mini-btn.withdraw:hover { border-color: var(--border); }

    /* ЭФФЕКТЫ */
    .confetti {
        position: fixed; width: 6px; height: 6px;
        border-radius: 1px; pointer-events: none; z-index: 999;
        animation: confettiFly 1.6s cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
    }
    @keyframes confettiFly {
        0% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.2); opacity: 0; }
    }
    .flash-red {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 998;
    }
    .flash-red.active { animation: flashRed 0.6s; }
    @keyframes flashRed {
        0% { background: rgba(255, 71, 87, 0); }
        20% { background: rgba(255, 71, 87, 0.35); }
        100% { background: rgba(255, 71, 87, 0); }
    }
    .shake { animation: shakeAnim 0.45s; }
    @keyframes shakeAnim {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }

    .footer {
        text-align: center; margin-top: 8px;
        font-size: 9px; color: var(--text-mute);
        padding-bottom: 4px; flex-shrink: 0;
        letter-spacing: 0.01em;
    }
    .footer a { color: var(--text-dim); text-decoration: none; font-weight: 500; }

    @media (min-width: 420px) {
        .wheel-wrap { width: 170px; height: 170px; }
        .wheel-col { min-width: 170px; }
        .wheel-center { width: 100px; height: 100px; }
        .wheel-percent { font-size: 25px; }
        .wheel-label { font-size: 8px; }
        .item-slot { min-height: 155px; }
        .slot-icon { width: 72px; height: 72px; }
        .item-name { font-size: 11px; }
        .item-value { font-size: 13px; }
    }

    @media (min-width: 600px) {
        body { padding: 16px; }
        .header { padding: 12px 16px; }
        .logo { font-size: 17px; }
        .wheel-wrap { width: 220px; height: 220px; }
        .wheel-col { min-width: 220px; }
        .wheel-center { width: 130px; height: 130px; }

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    /* ============== НАСТРОЙКИ ============== */
    const VIB_KEY = 'psygg_vibration';
    const SND_KEY = 'psygg_sound';
    let vibrationEnabled = localStorage.getItem(VIB_KEY) !== 'false';
    let soundEnabled = localStorage.getItem(SND_KEY) !== 'false';

    const USED_KEY = 'psygg_used_promos';
    const HISTORY_KEY = 'psygg_history';
    const INV_KEY = 'psygg_inventory';

    const PROMO_CODES = {
        'ROMANARMATURA777': { amount: 10 },
        'CHIHARDEDEP':      { amount: 20 }
    };

    function getUsedCodes() {
        try { return JSON.parse(localStorage.getItem(USED_KEY) || '[]'); }
        catch { return []; }
    }
    function markCodeUsed(code) {
        const u = getUsedCodes();
        if (!u.includes(code)) { u.push(code); localStorage.setItem(USED_KEY, JSON.stringify(u)); }
    }
    function isCodeUsed(code) { return getUsedCodes().includes(code); }

    /* ============== ЗВУКИ (Web Audio API) ============== */
    let audioCtx = null;

    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { console.warn('Audio not supported'); }
    }

    function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15, startDelay = 0) {
        if (!soundEnabled || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime + startDelay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + duration);
    }

    // Клик по кнопкам
    function sndClick() {
        if (!soundEnabled) return;
        initAudio();
        playTone(800, 0.04, 'square', 0.06);
    }

    // Покупка
    function sndBuy() {
        if (!soundEnabled) return;
        initAudio();
        playTone(523, 0.1, 'sine', 0.15, 0);
        playTone(659, 0.1, 'sine', 0.15, 0.08);
        playTone(784, 0.15, 'sine', 0.15, 0.16);
    }

    // Тик барабана
    function sndTick() {
        if (!soundEnabled) return;
        initAudio();
        playTone(1200 + Math.random() * 200, 0.02, 'square', 0.04);
    }

    // Крутка — старт
    function sndSpinStart() {
        if (!soundEnabled) return;
        initAudio();
        playTone(200, 0.2, 'sawtooth', 0.1);
        playTone(300, 0.2, 'sawtooth', 0.08, 0.05);
    }

    // Выигрыш — фанфары
    function sndWin() {
        if (!soundEnabled) return;
        initAudio();
        const notes = [523, 659, 784, 1047];
        notes.forEach((f, i) => playTone(f, 0.2, 'sine', 0.18, i * 0.1));
        playTone(1319, 0.4, 'sine', 0.15, 0.4);
    }

    // Проигрыш — нисходящий
    function sndLose() {
        if (!soundEnabled) return;
        initAudio();
        playTone(400, 0.15, 'sawtooth', 0.12, 0);
        playTone(300, 0.15, 'sawtooth', 0.12, 0.12);
        playTone(200, 0.35, 'sawtooth', 0.14, 0.24);
    }

    // Промокод активирован
    function sndPromo() {
        if (!soundEnabled) return;
        initAudio();
        playTone(784, 0.1, 'sine', 0.15, 0);
        playTone(1047, 0.1, 'sine', 0.15, 0.08);
        playTone(1319, 0.25, 'sine', 0.15, 0.16);
    }

    // Ошибка
    function sndError() {
        if (!soundEnabled) return;
        initAudio();
        playTone(200, 0.1, 'square', 0.12, 0);
        playTone(150, 0.2, 'square', 0.12, 0.1);
    }

    /* ============== КАТАЛОГ ГИФТОВ (реальные названия и цены) ============== */
    const FALLBACK = [
        { name: 'Heart',          slug: 'heart',         value: 15 },
        { name: 'Teddy Bear',     slug: 'teddybear',     value: 15 },
        { name: 'Rose',           slug: 'rose',          value: 25 },
        { name: 'Rocket',         slug: 'rocket',        value: 50 },
        { name: 'Jingle Bells',   slug: 'jinglebells',   value: 80 },
        { name: 'Homemade Cake',  slug: 'homemadecake',  value: 100 },
        { name: 'Eternal Rose',   slug: 'eternalrose',   value: 150 },
        { name: 'Magic Potion',   slug: 'magicpotion',   value: 200 },
        { name: 'Crystal Ball',   slug: 'crystalball',   value: 280 },
        { name: 'Top Hat',        slug: 'tophat',        value: 380 },
        { name: "Durov's Cap",    slug: 'durovscap',     value: 500 },
        { name: 'Diamond Ring',   slug: 'diamondring',   value: 700 },
        { name: 'Sakura Flower',  slug: 'sakuraflower',  value: 950 },
        { name: 'Jolly Chimp',    slug: 'jollychimp',    value: 1300 },
        { name: 'Plush Pepe',     slug: 'plushpepe',     value: 1800 },
        { name: 'Snoop Dogg',     slug: 'snoopdogg',     value: 2500 },
        { name: 'Swiss Watch',    slug: 'swisswatch',    value: 3500 },
        { name: 'Precious Peach', slug: 'preciouspeach', value: 5000 },
        { name: 'Signet Ring',    slug: 'signetring',    value: 7000 },
        { name: 'Santa Hat',      slug: 'santahat',      value: 10000 },
        { name: 'Astral Shard',   slug: 'astralshard',   value: 25000 },
        { name: 'Mighty Arm',     slug: 'mightyarm',     value: 50000 }
    ];

    const MULTIPLIERS = [1.2, 1.5, 2, 3, 5, 10, 25, 100];
    const SPIN_DURATION = 7500;

    let CATALOG = [];
    let balance = 1000;
    let inventory = [];
    let history = [];
    let currentItem = null;
    let targetItem = null;
    let chance = 50;
    let multiplier = 2;
    let isSpinning = false;
    let invSearch = '', invMin = null, invMax = null;
    let shopSearch = '', shopMin = null, shopMax = null;

    const $ = id => document.getElementById(id);

    async function loadCatalog() {
        try {
            const r = await fetch('https://api.changes.tg/gifts');
            if (!r.ok) throw new Error();
            const d = await r.json();
            CATALOG = d.map((it, i) => ({
                name: it.name || `Gift ${i}`,
                slug: (it.slug || it.name || '').toLowerCase().replace(/[^a-z0-9]/g, ''),
                value: it.value || it.price || (i + 1) * 50
            }));
        } catch {
            CATALOG = [...FALLBACK];
        }
    }

    /* ============== КАРТИНКИ ГИФТОВ ============== */
    function imgUrl(item, size = 128) {
        return `https://nft.fragment.com/gift/${item.slug}.${size >= 128 ? 500 : 200}.webp`;
    }
    function iconHTML(item, size = 128) {
        return `<img src="${imgUrl(item, size)}" loading="lazy" alt="${item.name}" onerror="this.style.display='none'">`;
    }

    /* ============== ВСПОМОГАТЕЛЬНЫЕ ============== */
    function chanceFromRatio(r) {
        let c = 100 / r;
        if (c > 99) c = 99;
        if (c < 1) c = 1;
        return Math.round(c * 100) / 100;
    }
    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    function recomputeChance() {
        if (!currentItem || !targetItem) return;
        const r = targetItem.value / currentItem.value;
        chance = chanceFromRatio(r);
        multiplier = Math.round(r * 100) / 100;
        updatePercentUI();
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = chance.toFixed(2).replace(/\.00$/, '') + '%';
        $('wheel-label').textContent = chanceLabel(chance);
        updateArc();
        highlightMult();
    }

    function highlightMult() {
        document.querySelectorAll('.mult-btn').forEach(b => {
            const v = parseFloat(b.dataset.mult);
            b.classList.toggle('active', Math.abs(v - multiplier) < 0.15);
        });
    }

    function updateArc() {
        const arc = $('win-arc');
        const cx = 50, cy = 50;
        const half = Math.min(179.9, chance * 3.6 / 2);
        const a0 = 180 - half, a1 = 180 + half;
        const rad = d => d * Math.PI / 180;
        const large = (a1 - a0) > 180 ? 1 : 0;
        const ro = 49, ri = 39;
        const xo1 = cx + ro * Math.sin(rad(a0)), yo1 = cy - ro * Math.cos(rad(a0));
        const xo2 = cx + ro * Math.sin(rad(a1)), yo2 = cy - ro * Math.cos(rad(a1));
        const xi1 = cx + ri * Math.sin(rad(a0)), yi1 = cy - ri * Math.cos(rad(a0));
        const xi2 = cx + ri * Math.sin(rad(a1)), yi2 = cy - ri * Math.cos(rad(a1));
        arc.setAttribute('d', [
            `M ${xo1} ${yo1}`,
            `A ${ro} ${ro} 0 ${large} 1 ${xo2} ${yo2}`,
            `L ${xi2} ${yi2}`,
            `A ${ri} ${ri} 0 ${large} 0 ${xi1} ${yi1}`,
            'Z'
        ].join(' '));
    }

    /* ============== СОХРАНЕНИЕ ============== */
    function saveState() {
        try {
            localStorage.setItem(INV_KEY, JSON.stringify(inventory));
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 50)));
        } catch {}
    }
    function loadState() {
        try {
            const inv = JSON.parse(localStorage.getItem(INV_KEY) || 'null');
            const his = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
            if (inv) inventory = inv;
            if (his) history = his;
        } catch {}
    }

    /* ============== АРЕНА ============== */
    function renderArena() {
        if (currentItem) {
            $('from-icon').innerHTML = iconHTML(currentItem, 128);
            $('from-name').textContent = currentItem.name;
            $('from-value').textContent = currentItem.value + ' ⭐';
        } else {
            $('from-icon').innerHTML = '';
            $('from-name').textContent = 'Выбери';
            $('from-value').textContent = '—';
        }
        if (targetItem) {
            $('to-icon').innerHTML = iconHTML(targetItem, 128);
            $('to-name').textContent = targetItem.name;
            $('to-value').textContent = targetItem.value + ' ⭐';
        } else {
            $('to-icon').innerHTML = '';
            $('to-name').textContent = 'Выбери цель';
            $('to-value').textContent = '—';
        }
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';
    }

    /* ============== ИНВЕНТАРЬ ============== */
    function renderInventory() {
        const grid = $('inv-grid');
        grid.innerHTML = '';
        $('inv-count').textContent = `(${inventory.length})`;
        const list = inventory.filter(it => {
            if (invSearch && !it.name.toLowerCase().includes(invSearch.toLowerCase())) return false;
            if (invMin !== null && it.value < invMin) return false;
            if (invMax !== null && it.value > invMax) return false;
            return true;
        });
        if (!list.length) {
            grid.innerHTML = `<div class="empty">${inventory.length === 0 ? 'Пусто' : 'Не найдено'}</div>`;
            return;
        }
        list.forEach(item => {
            const s = document.createElement('div');
            s.className = 'slot' + (item === currentItem ? ' selected' : '');
            s.innerHTML = `<div class="slot-icon-sm">${iconHTML(item, 64)}</div><div class="slot-name">${item.name}</div><div class="slot-price">${item.value}⭐</div>`;
            s.onclick = () => {
                if (isSpinning) return;
                sndClick();
                currentItem = item;
                if (targetItem && targetItem.value <= currentItem.value) targetItem = null;
                renderInventory(); renderArena();
                if (targetItem) recomputeChance();
                updateBtn();
            };
            grid.appendChild(s);
        });
    }

    /* ============== МАГАЗИН ============== */
    function renderShop() {
        const grid = $('shop-grid');
        grid.innerHTML = '';
        const list = CATALOG.filter(it => {
            if (shopSearch && !it.name.toLowerCase().includes(shopSearch.toLowerCase())) return false;
            if (shopMin !== null && it.value < shopMin) return false;
            if (shopMax !== null && it.value > shopMax) return false;
            return true;
        });
        if (!list.length) {
            grid.innerHTML = `<div class="empty">Не найдено</div>`;
            return;
        }
        list.forEach(item => {
            const s = document.createElement('div');
            s.className = 'slot' + (targetItem === item ? ' selected' : '') + (item.value > balance ? ' disabled' : '');
            s.innerHTML = `<div class="slot-icon-sm">${iconHTML(item, 64)}</div><div class="slot-name">${item.name}</div><div class="slot-price">${item.value}⭐</div>`;
            s.onclick = () => { if (isSpinning) return; sndClick(); openBuy(item); };
            grid.appendChild(s);
        });
    }

    /* ============== ПОКУПКА ============== */
    let buyItem = null;
    function openBuy(item) {
        buyItem = item;
        $('buy-icon').innerHTML = iconHTML(item, 128);
        $('buy-name').textContent = item.name;
        $('buy-price').textContent = item.value + ' ⭐';
        $('buy-confirm').disabled = item.value > balance;
        $('buy-modal').classList.add('active');
    }
    function closeBuy() { $('buy-modal').classList.remove('active'); buyItem = null; }
    $('buy-cancel').onclick = () => { sndClick(); closeBuy(); };
    $('buy-confirm').onclick = () => {
        if (!buyItem || buyItem.value > balance) return;
        balance -= buyItem.value;
        $('balance').textContent = balance;
        inventory.push({ ...buyItem });
        if (!currentItem) currentItem = inventory[inventory.length - 1];
        saveState();
        sndBuy();
        closeBuy();
        renderInventory(); renderArena(); renderShop(); updateBtn();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    };

    /* ============== ПРОМО ============== */
    function openPromo() {
        $('promo-modal').classList.add('active');
        $('promo-input').value = '';
        $('promo-message').textContent = '';
        $('promo-message').className = 'status-msg';
        setTimeout(() => $('promo-input').focus(), 200);
    }
    function closePromo() { $('promo-modal').classList.remove('active'); }
    function activatePromo() {
        const code = $('promo-input').value.trim().toUpperCase();
        const msg = $('promo-message');
        msg.className = 'status-msg';
        if (!code) {
            msg.textContent = 'Введи промокод';
            msg.classList.add('err');
            sndError();
            return;
        }
        const promo = PROMO_CODES[code];
        if (!promo) {
            msg.textContent = 'Неверный промокод';
            msg.classList.add('err');
            sndError();
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error');
            return;
        }
        if (isCodeUsed(code)) {
            msg.textContent = 'Уже активирован';
            msg.classList.add('err');
            sndError();
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error');
            return;
        }
        balance += promo.amount;
        $('balance').textContent = balance;
        markCodeUsed(code);
        msg.textContent = `+${promo.amount} ⭐`;
        msg.classList.add('ok');
        sndPromo();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
        confetti();
        renderShop();
        updateBtn();
        setTimeout(closePromo, 1200);
    }
    $('promo-btn').onclick = () => { sndClick(); openPromo(); };
    $('promo-cancel').onclick = () => { sndClick(); closePromo(); };
    $('promo-activate').onclick = activatePromo;
    $('promo-input').addEventListener('keydown', e => { if (e.key === 'Enter') activatePromo(); });
    $('promo-input').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });

    /* ============== НАСТРОЙКИ ============== */
    $('settings-btn').onclick = () => {
        sndClick();
        $('vibration-toggle').checked = vibrationEnabled;
        $('sound-toggle').checked = soundEnabled;
        $('settings-modal').classList.add('active');
    };
    $('settings-close').onclick = () => { sndClick(); $('settings-modal').classList.remove('active'); };
    $('vibration-toggle').onchange = (e) => {
        vibrationEnabled = e.target.checked;
        localStorage.setItem(VIB_KEY, vibrationEnabled);
    };
    $('sound-toggle').onchange = (e) => {
        soundEnabled = e.target.checked;
        localStorage.setItem(SND_KEY, soundEnabled);
        if (soundEnabled) {
            initAudio();
            sndClick();
        }
    };

    /* ============== ПРОФИЛЬ ============== */
    function openProfile() {
        const user = tg.initDataUnsafe?.user;
        const name = user ? [user.first_name, user.last_name].filter(Boolean).join(' ') : 'Игрок';
        $('profile-name').textContent = name || 'Игрок';
        $('profile-avatar').textContent = (name || 'И').charAt(0).toUpperCase();
        $('profile-drops').textContent = `${history.length} дропов`;
        $('profile-inv').textContent = `${inventory.length} в инвентаре`;
        renderHistory();
        renderProfileInventory();
        $('profile-modal').classList.add('active');
    }
    $('profile-btn').onclick = () => { sndClick(); openProfile(); };
    $('profile-close').onclick = () => { sndClick(); $('profile-modal').classList.remove('active'); };

    document.querySelectorAll('.profile-tab').forEach(t => {
        t.onclick = () => {
            sndClick();
            document.querySelectorAll('.profile-tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.profile-view').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            $('pview-' + t.dataset.pview).classList.add('active');
        };
    });

    function renderHistory() {
        const el = $('history-list');
        if (!history.length) {
            el.innerHTML = '<div class="empty">Пока пусто</div>';
            return;
        }
        el.innerHTML = history.slice(0, 30).map(h => {
            const time = new Date(h.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const icon = h.win ? iconHTML(h.to, 64) : iconHTML(h.from, 64);
            return `
                <div class="history-item">
                    <div class="history-icon">${icon}</div>
                    <div class="history-info">
                        <div class="history-name">${h.win ? h.to.name : h.from.name}</div>
                        <div class="history-sub">${h.win ? `+${h.to.value - h.from.value}` : `-${h.from.value}`} ⭐ · ${time}</div>
                    </div>
                    <div class="history-result ${h.win ? 'win' : 'lose'}">${h.win ? 'WIN' : 'LOSE'}</div>
                </div>
            `;
        }).join('');
    }

    function renderProfileInventory() {
        const el = $('profile-inv-list');
        if (!inventory.length) {
            el.innerHTML = '<div class="empty">Пусто</div>';
            return;
        }
        el.innerHTML = inventory.map((item, idx) => `
            <div class="inv-item">
                <div class="history-icon">${iconHTML(item, 64)}</div>
                <div class="history-info">
                    <div class="history-name">${item.name}</div>
                    <div class="history-sub">${item.value} ⭐</div>
                </div>
                <div class="inv-actions">
                    <button class="mini-btn sell" data-sell="${idx}">Продать</button>
                    <button class="mini-btn withdraw" disabled title="Скоро">Вывод</button>
                </div>
            </div>
        `).join('');

        el.querySelectorAll('[data-sell]').forEach(btn => {
            btn.onclick = () => {
                const idx = parseInt(btn.dataset.sell, 10);
                sndClick();
                openSell(idx);
            };
        });
    }

    /* ============== ПРОДАЖА ============== */
    let sellIdx = -1;
    function openSell(idx) {
        const item = inventory[idx];
        if (!item) return;
        sellIdx = idx;
        $('sell-icon').innerHTML = iconHTML(item, 128);
        $('sell-name').textContent = item.name;
        const price = Math.floor(item.value * 0.7);
        $('sell-info').innerHTML = `Продать за <b style="color: var(--gold);">${price} ⭐</b><br><span style="font-size: 9px;">(70% от стоимости)</span>`;
        $('sell-modal').classList.add('active');
    }
    function closeSell() { $('sell-modal').classList.remove('active'); sellIdx = -1; }
    $('sell-cancel').onclick = () => { sndClick(); closeSell(); };
    $('sell-confirm').onclick = () => {
        if (sellIdx < 0) return;
        const item = inventory[sellIdx];
        const price = Math.floor(item.value * 0.7);
        balance += price;
        $('balance').textContent = balance;
        if (currentItem === item) currentItem = null;
        inventory.splice(sellIdx, 1);
        saveState();
        sndBuy();
        closeSell();
        renderInventory(); renderArena(); renderShop(); updateBtn();
        renderProfileInventory();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    };

    /* ============== МНОЖИТЕЛИ ============== */
    function renderMult() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach(m => {
            const b = document.createElement('button');
            b.className = 'mult-btn';
            b.dataset.mult = m;
            const c = chanceFromRatio(m);
            b.innerHTML = `×${m}<span class="c">${c.toFixed(c < 10 ? 1 : 0)}%</span>`;
            b.onclick = () => {
                if (isSpinning || !currentItem) return;
                sndClick();
                const target = currentItem.value * m;
                const cands = CATALOG.filter(it => it.value > currentItem.value);
                if (!cands.length) return;
                const best = cands.reduce((p, c) => Math.abs(c.value - target) < Math.abs(p.value - target) ? c : p);
                targetItem = best;
                recomputeChance(); renderShop(); renderArena(); updateBtn();
            };
            grid.appendChild(b);
        });
    }

    function updateBtn() {
        $('upgrade-btn').disabled = isSpinning || !currentItem || !targetItem;
    }

    /* ============== ЭФФЕКТЫ ============== */
    function confetti() {
        const colors = ['#fff', '#2ecc71', '#4a86ff', '#a855f7', '#ffd93d', '#ff4757'];
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 55; i++) {
            const p = document.createElement('div');
            p.className = 'confetti';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = cx + 'px';
            p.style.top = cy + 'px';
            const a = Math.random() * Math.PI * 2;
            const v = 150 + Math.random() * 350;
            p.style.setProperty('--dx', Math.cos(a) * v + 'px');
            p.style.setProperty('--dy', (Math.sin(a) * v - 100) + 'px');
            p.style.animationDelay = (Math.random() * 0.12) + 's';
            if (Math.random() > 0.5) p.style.borderRadius = '50%';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 2200);
        }
    }
    function flashRed() {
        const el = $('flash-red');
        el.classList.remove('active');
        void el.offsetWidth;
        el.classList.add('active');
    }
    function shake() {
        document.body.classList.remove('shake');
        void document.body.offsetWidth;
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 600);
    }

    /* ============== АЗАРТ + ТИКИ БАРАБАНА ============== */
    let hb = null, tensionTimer = null, tickInterval = null;

    function startSpin() {
        const s = $('stage');
        s.classList.remove('snap', 'tension');
        requestAnimationFrame(() => s.classList.add('zooming'));
        $('wheel-wrap').classList.add('spinning');
        sndSpinStart();

        // Тики барабана — ускоряющиеся
        let tickDelay = 120;
        const tickLoop = () => {
            sndTick();
            tickDelay = Math.max(30, tickDelay * 0.94);
            tickInterval = setTimeout(tickLoop, tickDelay);
        };
        tickLoop();

        hb = setInterval(() => {
            if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('light');
        }, 600);

        tensionTimer = setTimeout(() => {
            $('stage').classList.add('tension');
            clearInterval(hb);
            hb = setInterval(() => {
                if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('medium');
            }, 140);
        }, SPIN_DURATION - 2400);
    }

    function endSpin(win) {
        clearInterval(hb);
        clearTimeout(tensionTimer);
        clearTimeout(tickInterval);
        hb = null; tensionTimer = null; tickInterval = null;

        const s = $('stage');
        s.classList.remove('zooming', 'tension');
        void s.offsetWidth;
        s.classList.add('snap');
        setTimeout(() => s.classList.remove('snap'), 550);

        $('wheel-wrap').classList.remove('spinning');
        if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('heavy');

        // Звук результата
        if (win) sndWin(); else sndLose();
    }

    function spin(ch) {
        return new Promise(resolve => {
            const p = $('wheel-pointer');
            const half = Math.min(179.9, ch * 3.6 / 2);
            const s0 = 180 - half, s1 = 180 + half;
            const wantWin = Math.random() * 100 < ch;
            let angle;
            if (wantWin) {
                angle = s0 + 1 + Math.random() * (s1 - s0 - 2);
            } else {
                const out = 360 - (s1 - s0);
                let off = 1 + Math.random() * (out - 2);
                angle = s1 + off;
                if (angle > 360) angle -= 360;
            }
            const turns = 8 + Math.floor(Math.random() * 4);
            const total = turns * 360 + angle;
            p.style.transition = 'none';
            p.style.transform = 'rotate(0deg)';
            void p.offsetWidth;
            p.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.7, 0.15, 1)`;
            p.style.transform = `rotate(${total}deg)`;
            const fin = ((total % 360) + 360) % 360;
            const real = fin >= s0 && fin <= s1;
            setTimeout(() => resolve(real), SPIN_DURATION + 100);
        });
    }

    async function doUpgrade() {
        if (isSpinning || !currentItem || !targetItem) return;
        isSpinning = true;
        $('upgrade-btn').disabled = true;
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';

        startSpin();
        const win = await spin(chance);
        endSpin(win);

        const idx = inventory.indexOf(currentItem);
        const fromCopy = { ...currentItem };
        const toCopy = { ...targetItem };

        if (win) {
            const newItem = { ...targetItem };
            inventory[idx] = newItem;
            currentItem = newItem;
            $('to-card').classList.add('win');
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
            confetti();
            history.unshift({ win: true, from: fromCopy, to: toCopy, time: Date.now() });
        } else {
            inventory.splice(idx, 1);
            currentItem = inventory[0] || null;
            targetItem = null;
            $('to-card').classList.add('lose');
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error');
            flashRed();
            shake();
            history.unshift({ win: false, from: fromCopy, to: null, time: Date.now() });
        }
        history = history.slice(0, 50);
        saveState();

        renderInventory(); renderArena(); renderShop();
        if (currentItem && targetItem) recomputeChance();
        else { chance = 50; multiplier = 2; updatePercentUI(); }
        setTimeout(() => { isSpinning = false; updateBtn(); }, 500);
    }

    /* ============== ТАБЫ ============== */
    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            sndClick();
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            $('view-' + t.dataset.tab).classList.add('active');
        };
    });

    /* ============== ПЛЮС ============== */
    $('plus-btn').onclick = () => {
        sndClick();
        const input = prompt('Сколько монет добавить?', '1000');
        if (input === null) return;
        const amt = parseInt(input, 10);
        if (isNaN(amt) || amt <= 0) return;
        balance += amt;
        $('balance').textContent = balance;
        renderShop();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    };

    /* ============== ФИЛЬТРЫ ============== */
    $('inv-search').addEventListener('input', e => { invSearch = e.target.value; renderInventory(); });
    $('inv-price-min').addEventListener('input', e => { const v = e.target.value.trim(); invMin = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('inv-price-max').addEventListener('input', e => { const v = e.target.value.trim(); invMax = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('shop-search').addEventListener('input', e => { shopSearch = e.target.value; renderShop(); });
    $('shop-price-min').addEventListener('input', e => { const v = e.target.value.trim(); shopMin = v === '' ? null : (parseFloat(v) || 0); renderShop(); });
    $('shop-price-max').addEventListener('input', e => { const v = e.target.value.trim(); shopMax = v === '' ? null : (parseFloat(v) || 0); renderShop(); });

    /* ============== ИНИЦИАЛИЗАЦИЯ АУДИО ПО ПЕРВОМУ КЛИКУ ============== */
    // Браузеры требуют user gesture для запуска AudioContext
    document.body.addEventListener('touchstart', initAudio, { once: true });
    document.body.addEventListener('click', initAudio, { once: true });

    /* ============== СТАРТ ============== */
    async function init() {
        await loadCatalog();
        loadState();
        if (!inventory.length) {
            const pool = CATALOG.slice(0, Math.min(12, CATALOG.length));
            for (let i = 0; i < 8; i++) {
                inventory.push({ ...pool[Math.floor(Math.random() * pool.length)] });
            }
            saveState();
        }
        currentItem = inventory[0] || null;
        targetItem = null;
        chance = 50;
        multiplier = 2;
        renderMult(); renderInventory(); renderArena(); renderShop();
        updatePercentUI(); updateBtn();
    }

    init();
    $('upgrade-btn').onclick = doUpgrade;
</script>
</body>
               </html>

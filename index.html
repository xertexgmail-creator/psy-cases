<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>АПГРЕЙДЕР — PSY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background: #0f0f0f;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 12px;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 12px;
        background: linear-gradient(90deg, #1a1a1a, #141414);
        border-radius: 12px;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .logo {
        font-size: 14px; font-weight: 800; letter-spacing: 0.5px;
        color: #f5c518;
        text-transform: uppercase;
    }
    .balance {
        background: rgba(245,197,24,0.12);
        border: 1px solid rgba(245,197,24,0.35);
        padding: 5px 12px; border-radius: 16px;
        font-size: 13px; font-weight: 700;
        color: #f5c518;
    }

    .arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        align-items: stretch;
        margin-bottom: 14px;
    }
    .item-slot {
        background: linear-gradient(160deg, #1c1c1c, #121212);
        border-radius: 14px;
        padding: 22px 8px 14px 8px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.06);
        transition: all 0.3s;
        min-height: 190px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        position: relative;
    }
    .item-slot.win { border-color: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.4); }
    .item-slot.lose { border-color: #ef4444; box-shadow: 0 0 25px rgba(239,68,68,0.4); }

    .slot-title {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 10px;
        position: absolute;
        top: 10px; left: 0; right: 0;
    }

    .item-img {
        width: 84px; height: 84px;
        object-fit: contain;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 12px rgba(245,197,24,0.25));
        transition: all 0.3s;
    }
    .item-name {
        font-size: 11px;
        color: #ccc;
        margin-bottom: 4px;
        line-height: 1.2;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .item-value {
        font-size: 14px;
        font-weight: 700;
        color: #f5c518;
    }

    .wheel-col {
        display: flex; flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 170px;
    }

    .wheel-wrap {
        position: relative;
        width: 170px; height: 170px;
    }
    .wheel-svg { width: 100%; height: 100%; }
    .wheel-pointer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transition: transform 2.5s cubic-bezier(0.2, 0.7, 0.15, 1);
    }
    .wheel-pointer::before {
        content: '';
        position: absolute;
        top: -4px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 16px solid #fff;
        filter: drop-shadow(0 0 10px #f5c518);
    }

    .wheel-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 95px; height: 95px;
        border-radius: 50%;
        background: radial-gradient(circle, #1a1a1a 60%, #0f0f0f 100%);
        border: 2px solid rgba(245,197,24,0.3);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 3;
        box-shadow: 0 0 20px rgba(245,197,24,0.2) inset;
    }
    .wheel-percent {
        font-size: 26px;
        font-weight: 800;
        color: #f5c518;
        line-height: 1;
    }
    .wheel-chance-label {
        font-size: 9px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 3px;
    }

    /* ШКАЛА ПРОЦЕНТОВ И КЭФОВ — маленькая под полоской */
    .mini-scales {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        width: 100%;
    }
    .mini-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
    }
    .mini-row .label {
        color: #666;
        min-width: 32px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    .mini-bar {
        flex: 1;
        height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px;
        overflow: hidden;
    }
    .mini-fill {
        height: 100%;
        background: #f5c518;
        border-radius: 2px;
        transition: width 0.25s;
    }
    .mini-value {
        color: #f5c518;
        font-weight: 700;
        min-width: 36px;
        text-align: right;
    }

    .multiplier-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 14px;
    }
    .mult-btn {
        background: linear-gradient(160deg, #1c1c1c, #151515);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        padding: 16px 4px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
    }
    .mult-btn.active {
        background: linear-gradient(135deg, #f5c518, #e0a800);
        border-color: transparent;
        color: #000;
        box-shadow: 0 4px 20px rgba(245,197,24,0.5);
    }
    .mult-btn .chance {
        display: block;
        font-size: 10px;
        color: #888;
        font-weight: 500;
        margin-top: 3px;
    }
    .mult-btn.active .chance { color: rgba(0,0,0,0.7); }

    .action-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #f5c518, #e0a800);
        border: none;
        border-radius: 14px;
        color: #000;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 8px 30px rgba(245,197,24,0.35);
        transition: transform 0.1s;
        margin-bottom: 14px;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.5; }

    /* ДВЕ КОЛОНКИ: инвентарь слева, цели справа */
    .two-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .col-block {
        background: #161616;
        border-radius: 14px;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.05);
        max-height: 240px;
        overflow-y: auto;
    }
    .col-block h4 {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
        margin-bottom: 8px;
    }
    .gift-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 6px;
        border-radius: 8px;
        margin-bottom: 4px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.04);
        cursor: pointer;
        transition: all 0.15s;
    }
    .gift-item.active {
        border-color: #f5c518;
        background: rgba(245,197,24,0.08);
    }
    .gift-item img {
        width: 26px; height: 26px;
        object-fit: contain;
        flex-shrink: 0;
    }
    .gift-item .gname {
        flex: 1;
        font-size: 10px;
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .gift-item .gval {
        font-size: 10px;
        color: #f5c518;
        font-weight: 700;
    }

    .footer {
        text-align: center;
        margin-top: 18px;
        font-size: 10px;
        color: #555;
        padding-bottom: 10px;
    }
    .footer a { color: #f5c518; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
    <div class="logo">🔱 Апгрейдер Gifts</div>
    <div class="balance">⭐ <span id="balance">1000</span></div>
</div>

<div class="arena">
    <div class="item-slot" id="from-card">
        <div class="slot-title">Твой гифт</div>
        <img class="item-img" id="from-img" src="" alt="">
        <div class="item-name" id="from-name">—</div>
        <div class="item-value" id="from-value">—</div>
    </div>

    <div class="wheel-col">
        <div class="wheel-wrap">
            <svg class="wheel-svg" viewBox="0 0 100 100">
                <!-- фон обода -->
                <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
                <!-- жёлтый сектор победы: снизу, растёт вверх -->
                <circle id="win-arc" cx="50" cy="50" r="44" fill="none"
                        stroke="#f5c518" stroke-width="10"
                        stroke-linecap="butt"
                        transform="rotate(90 50 50)"
                        stroke-dasharray="0 276.46"/>
                <!-- обводка -->
                <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(245,197,24,0.12)" stroke-width="0.5"/>
            </svg>
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center">
                <div class="wheel-percent" id="wheel-percent">65%</div>
                <div class="wheel-chance-label" id="wheel-label">средний</div>
            </div>
        </div>

        <!-- МИНИ-ШКАЛЫ под колесом -->
        <div class="mini-scales">
            <div class="mini-row">
                <span class="label">%</span>
                <div class="mini-bar"><div class="mini-fill" id="mini-chance-fill"></div></div>
                <span class="mini-value" id="mini-chance-val">65%</span>
            </div>
            <div class="mini-row">
                <span class="label">×</span>
                <div class="mini-bar"><div class="mini-fill" id="mini-mult-fill"></div></div>
                <span class="mini-value" id="mini-mult-val">1.5</span>
            </div>
        </div>
    </div>

    <div class="item-slot" id="to-card">
        <div class="slot-title">Цель</div>
        <img class="item-img" id="to-img" src="" alt="" style="opacity:0.35;">
        <div class="item-name" id="to-name">—</div>
        <div class="item-value" id="to-value">—</div>
    </div>
</div>

<div class="multiplier-grid" id="mult-grid"></div>

<button class="action-btn" id="upgrade-btn">Прокачать</button>

<div class="two-cols">
    <div class="col-block">
        <h4>Мои гифты</h4>
        <div id="my-gifts"></div>
    </div>
    <div class="col-block">
        <h4>Доступные цели</h4>
        <div id="target-gifts"></div>
    </div>
</div>

<div class="footer">
    powered by <a href="https://api.changes.tg" target="_blank">@GiftChanges</a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ====== ГИФТЫ: официальные API-имена ======
    const ITEMS = [
        { api: 'Heart',       name: 'Heart',        value: 15    },
        { api: 'TeddyBear',   name: 'Teddy Bear',   value: 15    },
        { api: 'Present',     name: 'Present',      value: 25    },
        { api: 'Rose',        name: 'Rose',         value: 25    },
        { api: 'Cake',        name: 'Cake',         value: 50    },
        { api: 'Bouquet',     name: 'Bouquet',      value: 50    },
        { api: 'Rocket',      name: 'Rocket',       value: 50    },
        { api: 'Champagne',   name: 'Champagne',    value: 50    },
        { api: 'Trophy',      name: 'Trophy',       value: 100   },
        { api: 'Crown',       name: 'Crown',        value: 100   },
        { api: 'Ring',        name: 'Ring',         value: 100   },
        { api: 'Diamond',     name: 'Diamond',      value: 100   },
        { api: 'JollyChimp',  name: 'Jolly Chimp',  value: 250   },
        { api: 'PlushPepe',   name: 'Plush Pepe',   value: 500   },
        { api: 'SnoopDogg',   name: 'Snoop Dogg',   value: 1000  },
        { api: 'Papakha',     name: 'Papakha',      value: 2500  }
    ];

    const MULTIPLIERS = [
        { mult: 1.2, chance: 80 },
        { mult: 1.5, chance: 65 },
        { mult: 2.0, chance: 50 },
        { mult: 3.0, chance: 33 },
        { mult: 5.0, chance: 20 },
        { mult: 10,  chance: 10 },
        { mult: 25,  chance: 4  },
        { mult: 100, chance: 1  }
    ];

    // Длина окружности радиуса 44 = 2 * π * 44 ≈ 276.46
    const CIRCUMFERENCE = 2 * Math.PI * 44;

    function giftImage(apiName, size = 128) {
        return `https://api.changes.tg/original/${apiName}.png?size=${size}`;
    }

    let balance = 1000;
    let currentItem = ITEMS[3];
    let currentMult = MULTIPLIERS[1];
    let isSpinning = false;

    const $ = id => document.getElementById(id);

    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    // ===== ЖЁЛТЫЙ СЕКТОР ПОБЕДЫ =====
    // Сектор начинается снизу (180° в SVG) и растёт симметрично вверх.
    // Чем выше шанс — тем больше жёлтая дуга.
    function updateWinArc() {
        const arc = $('win-arc');
        const winLength = (currentMult.chance / 100) * CIRCUMFERENCE;
        arc.setAttribute('stroke-dasharray', `${winLength} ${CIRCUMFERENCE}`);
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = currentMult.chance + '%';
        $('wheel-label').textContent = chanceLabel(currentMult.chance);
        $('mini-chance-fill').style.width = currentMult.chance + '%';
        $('mini-chance-val').textContent = currentMult.chance + '%';
        $('mini-mult-fill').style.width = Math.min(100, (currentMult.mult / 100) * 100) + '%';
        $('mini-mult-val').textContent = '×' + currentMult.mult;
        updateWinArc();
    }

    function renderMultipliers() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach((m, i) => {
            const btn = document.createElement('button');
            btn.className = 'mult-btn' + (i === 1 ? ' active' : '');
            btn.innerHTML = `×${m.mult}<span class="chance">${m.chance}%</span>`;
            btn.onclick = () => {
                if (isSpinning) return;
                document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMult = m;
                updatePercentUI();
                updatePreview();
            };
            grid.appendChild(btn);
        });
    }

    function updatePreview() {
        const targetValue = Math.round(currentItem.value * currentMult.mult);
        const targetItem = ITEMS.reduce((prev, curr) =>
            Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
        );
        $('to-img').src = giftImage(targetItem.api);
        $('to-img').style.opacity = '0.35';
        $('to-name').textContent = targetItem.name;
        $('to-value').textContent = targetItem.value + ' ⭐';
        $('to-card').className = 'item-slot';
        renderTargets();
    }

    function updateFromCard() {
        $('from-img').src = giftImage(currentItem.api);
        $('from-img').style.opacity = '1';
        $('from-name').textContent = currentItem.name;
        $('from-value').textContent = currentItem.value + ' ⭐';
        updatePreview();
    }

    function renderMyGifts() {
        const el = $('my-gifts');
        el.innerHTML = '';
        const idx = ITEMS.indexOf(currentItem);
        const pool = ITEMS.slice(Math.max(0, idx - 2), idx + 3);
        pool.forEach(it => {
            const div = document.createElement('div');
            div.className = 'gift-item' + (it === currentItem ? ' active' : '');
            div.innerHTML = `
                <img src="${giftImage(it.api, 64)}" alt="">
                <span class="gname">${it.name}</span>
                <span class="gval">${it.value}⭐</span>
            `;
            div.onclick = () => {
                if (isSpinning) return;
                currentItem = it;
                updateFromCard();
                renderMyGifts();
            };
            el.appendChild(div);
        });
    }

    function renderTargets() {
        const el = $('target-gifts');
        el.innerHTML = '';
        const idx = ITEMS.indexOf(currentItem);
        const targets = ITEMS.slice(idx + 1, idx + 6);
        targets.forEach(it => {
            const div = document.createElement('div');
            div.className = 'gift-item';
            div.innerHTML = `
                <img src="${giftImage(it.api, 64)}" alt="">
                <span class="gname">${it.name}</span>
                <span class="gval">${it.value}⭐</span>
            `;
            el.appendChild(div);
        });
    }

    // ===== КОЛЕСО =====
    // Сектор победы: снизу, растёт вверх симметрично.
    // Стрелка: 0° = верх. Сектор победы центрируется на 180° (низ).
    // Стрелка попадает в сектор, если угол в диапазоне:
    //   180 - (chance*3.6/2) ... 180 + (chance*3.6/2)
    function spinWheel(chance) {
        return new Promise(resolve => {
            const pointer = $('wheel-pointer');

            const isWin = Math.random() * 100 < chance;
            const sectorSize = chance * 3.6;
            const centerAngle = 180;

            let targetAngle;
            if (isWin) {
                const half = sectorSize / 2;
                targetAngle = centerAngle + (Math.random() * 2 - 1) * (half * 0.9);
            } else {
                const half = sectorSize / 2;
                const outsideSize = 360 - sectorSize;
                let offset = Math.random() * outsideSize;
                targetAngle = centerAngle + half + offset;
            }

            targetAngle = ((targetAngle % 360) + 360) % 360;

            const turns = 3 + Math.floor(Math.random() * 2);
            const totalAngle = turns * 360 + targetAngle;

            pointer.style.transition = 'none';
            pointer.style.transform = 'rotate(0deg)';
            void pointer.offsetWidth;

            pointer.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.7, 0.15, 1)';
            pointer.style.transform = `rotate(${totalAngle}deg)`;

            setTimeout(() => resolve(isWin), 2600);
        });
    }

    async function doUpgrade() {
        if (isSpinning) return;

        isSpinning = true;
        $('upgrade-btn').disabled = true;
        $('to-card').className = 'item-slot';

        const targetValue = Math.round(currentItem.value * currentMult.mult);
        const win = await spinWheel(currentMult.chance);

        if (win) {
            const newItem = ITEMS.reduce((prev, curr) =>
                Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
            );

            $('to-img').src = giftImage(newItem.api);
            $('to-img').style.opacity = '1';
            $('to-name').textContent = newItem.name;
            $('to-value').textContent = newItem.value + ' ⭐';
            $('to-card').classList.add('win');

            tg.HapticFeedback?.notificationOccurred('success');
            currentItem = newItem;
        } else {
            $('to-img').src = giftImage(currentItem.api);
            $('to-img').style.opacity = '0.15';
            $('to-name').textContent = 'Провал';
            $('to-value').textContent = '−' + currentItem.value + ' ⭐';
            $('to-card').classList.add('lose');

            tg.HapticFeedback?.notificationOccurred('error');
            balance = Math.max(0, balance - currentItem.value);
            $('balance').textContent = balance;
        }

        setTimeout(() => {
            updateFromCard();
            renderMyGifts();
            renderTargets();
            isSpinning = false;
            $('upgrade-btn').disabled = false;
        }, 600);
    }

    renderMultipliers();
    updateFromCard();
    updatePercentUI();
    renderMyGifts();
    renderTargets();
    $('upgrade-btn').onclick = doUpgrade;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПСЫ.gg — Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
        --bg: #08080c;
        --bg-elevated: #101018;
        --bg-card: #16161f;
        --border: rgba(255, 255, 255, 0.06);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #f5f5f7;
        --text-dim: #8a8a95;
        --text-mute: #55555f;
        --accent: #ffffff;
        --green: #2ecc71;
        --red: #ff4757;
        --gold: #ffd93d;
    }

    html, body { overflow-x: hidden; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        padding: 8px;
        min-height: 100vh;
        position: relative;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
        display: flex;
        flex-direction: column;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 90% 60% at 50% -10%, rgba(120, 100, 255, 0.18) 0%, transparent 60%),
            radial-gradient(ellipse 70% 50% at 0% 50%, rgba(74, 134, 255, 0.08) 0%, transparent 60%),
            radial-gradient(ellipse 70% 50% at 100% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.4'/></svg>");
        opacity: 0.035;
        pointer-events: none;
        z-index: 0;
    }

    .stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        transform-origin: 50% 45%;
        transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        will-change: transform;
    }
    .stage.zooming {
        transform: scale(1.06);
        transition: transform 6s cubic-bezier(0.25, 0.1, 0.3, 1);
    }
    .stage.tension { animation: tensionShake 0.12s ease-in-out infinite; }
    @keyframes tensionShake {
        0%, 100% { transform: scale(1.06) translate(0, 0); }
        25% { transform: scale(1.06) translate(-1.2px, 1px); }
        50% { transform: scale(1.06) translate(1.2px, -1px); }
        75% { transform: scale(1.06) translate(-1px, -1px); }
    }
    .stage.snap { animation: snapBack 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes snapBack {
        0% { transform: scale(1.06); }
        40% { transform: scale(0.95); }
        100% { transform: scale(1); }
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: linear-gradient(180deg, rgba(22,22,32,0.9) 0%, rgba(16,16,24,0.7) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid var(--border);
        margin-bottom: 8px;
        flex-shrink: 0;
        gap: 6px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .logo {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: -0.02em;
        flex-shrink: 0;
        background: linear-gradient(135deg, #fff 0%, #c0c8ff 50%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 12px rgba(168,85,247,0.3));
    }
    .logo .dot { -webkit-text-fill-color: var(--text-mute); }

    .header-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    .icon-btn {
        width: 34px; height: 34px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-dim);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        padding: 0;
        position: relative;
        overflow: hidden;
    }
    .icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 16px; height: 16px; position: relative; z-index: 1; }

    .balance-chip {
        display: flex; align-items: center; gap: 5px;
        background: linear-gradient(135deg, #ffffff, #d0d4ff);
        color: #000;
        padding: 7px 12px;
        border-radius: 11px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: -0.02em;
        cursor: default;
        transition: all 0.15s;
        box-shadow: 0 4px 16px rgba(255,255,255,0.15), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .balance-chip.admin { cursor: pointer; }
    .balance-chip.admin:active { transform: scale(0.95); }
    .balance-chip svg { width: 12px; height: 12px; }
    .balance-chip .plus-sign {
        font-size: 14px;
        font-weight: 900;
        margin-left: 2px;
        line-height: 1;
        opacity: 0.6;
    }

    .arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 6px;
        align-items: stretch;
        margin-bottom: 8px;
        flex-shrink: 0;
    }

    .item-slot {
        background: linear-gradient(180deg, rgba(22,22,32,0.9) 0%, rgba(12,12,18,0.95) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        padding: 18px 6px 12px;
        text-align: center;
        border: 1px solid var(--border);
        min-height: 155px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        position: relative;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .item-slot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, var(--slot-glow, transparent) 0%, transparent 65%);
        opacity: 0.7;
        pointer-events: none;
        transition: opacity 0.4s;
    }

    .item-slot.win {
        border-color: rgba(46, 204, 113, 0.55);
        box-shadow: 0 0 30px rgba(46, 204, 113, 0.35), 0 8px 32px rgba(0,0,0,0.5), inset 0 0 30px rgba(46, 204, 113, 0.1);
    }
    .item-slot.win::before {
        background: radial-gradient(circle at 50% 50%, rgba(46, 204, 113, 0.3) 0%, transparent 65%);
    }
    .item-slot.lose {
        border-color: rgba(255, 71, 87, 0.55);
        box-shadow: 0 0 30px rgba(255, 71, 87, 0.35), 0 8px 32px rgba(0,0,0,0.5), inset 0 0 30px rgba(255, 71, 87, 0.1);
    }
    .item-slot.lose::before {
        background: radial-gradient(circle at 50% 50%, rgba(255, 71, 87, 0.3) 0%, transparent 65%);
    }

    .slot-title {
        position: absolute; top: 9px; left: 0; right: 0;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-mute);
        text-transform: uppercase;
        z-index: 1;
    }
    .slot-icon {
        width: 70px; height: 70px;
        margin-bottom: 6px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 6px 20px rgba(0,0,0,0.7));
    }
    .slot-icon img {
        width: 100%; height: 100%;
        object-fit: contain;
        animation: floaty 4s ease-in-out infinite;
    }
    @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }
    .item-name {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 3px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        position: relative;
        z-index: 1;
    }
    .item-value {
        font-size: 13px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
        position: relative;
        z-index: 1;
    }

    .wheel-col {
        display: flex; align-items: center; justify-content: center;
        min-width: 155px; position: relative;
    }
    .wheel-wrap {
        position: relative;
        width: 155px; height: 155px;
        transition: filter 0.4s;
    }
    .wheel-wrap::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            rgba(120, 100, 255, 0),
            rgba(120, 100, 255, 0.4),
            rgba(168, 85, 247, 0.4),
            rgba(120, 100, 255, 0));
        filter: blur(10px);
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
    }
    .wheel-wrap.spinning::before {
        opacity: 1;
        animation: spinGlowFast 1.2s linear infinite;
    }
    @keyframes spinGlowFast {
        to { transform: rotate(360deg); }
    }
    .wheel-wrap.spinning { filter: drop-shadow(0 0 24px rgba(120, 100, 255, 0.5)); }

    .wheel-svg { width: 100%; height: 100%; }

    .wheel-pointer {
        position: absolute;
        inset: 0;
        transition: transform 7.5s cubic-bezier(0.15, 0.7, 0.15, 1);
        will-change: transform;
    }
    .wheel-pointer::before {
        content: '';
        position: absolute;
        top: -3px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-top: 12px solid #fff;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.9)) drop-shadow(0 0 16px rgba(168,85,247,0.6));
    }

    .wheel-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 92px; height: 92px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 25%, #1a1a26 0%, #08080c 100%);
        border: 1px solid var(--border-strong);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 3;
        box-shadow:
            inset 0 0 24px rgba(0,0,0,0.8),
            inset 0 1px 0 rgba(255,255,255,0.1),
            0 0 24px rgba(120,100,255,0.15);
    }
    .wheel-percent {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(135deg, #fff 0%, #b0b8ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(120,100,255,0.4));
    }
    .wheel-label {
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-mute);
        text-transform: uppercase;
        margin-top: 3px;
    }

    .mult-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .mult-btn {
        background: linear-gradient(180deg, rgba(22,22,32,0.9) 0%, rgba(14,14,20,0.9) 100%);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 0;
        border-radius: 9px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: -0.02em;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        line-height: 1;
        position: relative;
        overflow: hidden;
        font-family: inherit;
    }
    .mult-btn:hover {
        border-color: var(--border-strong);
        transform: translateY(-1px);
    }
    .mult-btn:active { transform: scale(0.94); }
    .mult-btn.active {
        background: linear-gradient(135deg, #ffffff 0%, #d0d4ff 100%);
        border-color: transparent;
        color: #000;
        box-shadow: 0 4px 20px rgba(255,255,255,0.25), inset 0 1px 0 rgba(255,255,255,0.7);
    }
    .mult-btn .c {
        display: block;
        font-size: 6px;
        color: var(--text-mute);
        font-weight: 600;
        margin-top: 3px;
        letter-spacing: 0;
    }
    .mult-btn.active .c { color: rgba(0, 0, 0, 0.55); }

    .upgrade-btn {
        width: 65%;
        margin: 0 auto 10px;
        padding: 14px;
        background: linear-gradient(135deg, #ffffff 0%, #d0d4ff 100%);
        border: none;
        border-radius: 13px;
        color: #000;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
        font-family: inherit;
        box-shadow:
            0 8px 28px rgba(120,100,255,0.35),
            0 0 50px rgba(168,85,247,0.15),
            inset 0 1px 0 rgba(255,255,255,0.8);
        position: relative;
        overflow: hidden;
    }
    .upgrade-btn::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        transition: left 0.6s;
    }
    .upgrade-btn:hover:not(:disabled)::before { left: 100%; }
    .upgrade-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow:
            0 12px 36px rgba(120,100,255,0.5),
            0 0 70px rgba(168,85,247,0.25),
            inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .upgrade-btn:active:not(:disabled) { transform: scale(0.97) translateY(0); }
    .upgrade-btn:disabled {
        opacity: 0.28;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .tab {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 10px;
        border-radius: 11px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
        text-transform: uppercase;
    }
    .tab:hover { color: var(--text); border-color: var(--border-strong); }
    .tab.active {
        background: linear-gradient(180deg, rgba(22,22,32,0.9) 0%, rgba(14,14,20,0.9) 100%);
        color: var(--text);
        border-color: var(--border-strong);
    }

    .panel {
        background: linear-gradient(180deg, rgba(22,22,32,0.85) 0%, rgba(12,12,18,0.9) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 220px;
        max-height: 340px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .panel-view {
        display: none;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }
    .panel-view.active { display: flex; }

    .panel-tools {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr;
        gap: 5px;
        margin-bottom: 8px;
        flex-shrink: 0;
    }
    .search-box {
        display: flex; align-items: center; gap: 5px;
        background: rgba(0,0,0,0.35);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 10px;
        transition: all 0.2s;
    }
    .search-box:focus-within {
        border-color: var(--border-strong);
        background: rgba(0,0,0,0.5);
    }
    .search-box svg { width: 10px; height: 10px; color: var(--text-mute); flex-shrink: 0; }
    .search-box input {
        background: transparent; border: none; color: var(--text);
        font-size: 11px; font-family: inherit; width: 100%;
        outline: none; min-width: 0;
    }
    .search-box input::placeholder { color: var(--text-mute); }
    .num-input {
        background: rgba(0,0,0,0.35);
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        font-size: 11px;
        font-family: inherit;
        padding: 7px;
        width: 100%;
        min-width: 0;
        outline: none;
        text-align: center;
        transition: all 0.2s;
    }
    .num-input:focus { border-color: var(--border-strong); background: rgba(0,0,0,0.5); }
    .num-input::placeholder { color: var(--text-mute); }

    .items-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.1) transparent;
        position: relative;
    }
    .items-scroll::-webkit-scrollbar { height: 3px; width: 3px; }
    .items-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .item-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        min-width: 100%;
        padding-bottom: 4px;
    }

    .slot {
        background: linear-gradient(180deg, rgba(22,22,32,0.7) 0%, rgba(12,12,18,0.7) 100%);
        border: 1px solid var(--border);
        border-bottom: 2px solid var(--rar-color, transparent);
        border-radius: 10px;
        padding: 7px 3px 6px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
        position: relative;
        overflow: hidden;
    }
    .slot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 100%, var(--rar-color, transparent) 0%, transparent 60%);
        opacity: 0.08;
        pointer-events: none;
        transition: opacity 0.2s;
    }
    .slot:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .slot:hover::before { opacity: 0.18; }
    .slot:active { transform: scale(0.95); }
    .slot.selected {
        border-color: var(--accent);
        background: linear-gradient(180deg, rgba(50,50,70,0.7) 0%, rgba(20,20,30,0.7) 100%);
        box-shadow: 0 0 16px rgba(255,255,255,0.15), inset 0 0 16px rgba(255,255,255,0.05);
    }
    .slot.selected::before { opacity: 0.25; }
    .slot.disabled { opacity: 0.25; pointer-events: none; filter: grayscale(0.7); }
    .slot-icon-sm {
        width: 38px; height: 38px;
        margin: 0 auto 3px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
        z-index: 1;
    }
    .slot-icon-sm img { width: 100%; height: 100%; object-fit: contain; }
    .slot-name {
        font-size: 7px;
        color: var(--text-dim);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-weight: 600;
        position: relative;
        z-index: 1;
    }
    .slot-price {
        font-size: 8px;
        font-weight: 800;
        color: var(--text);
        margin-top: 2px;
        letter-spacing: -0.02em;
        position: relative;
        z-index: 1;
    }
    .empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--text-mute);
        font-size: 11px;
        padding: 24px 8px;
    }

    .overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: none;
        align-items: center; justify-content: center;
        z-index: 200;
        padding: 20px;
        animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    .overlay.active { display: flex; }
    .modal {
        background: linear-gradient(180deg, #1a1a26 0%, #0e0e16 100%);
        border: 1px solid var(--border-strong);
        border-radius: 20px;
        padding: 22px;
        max-width: 300px; width: 100%;
        animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-height: 80vh; overflow-y: auto;
        scrollbar-width: thin;
        box-shadow: 0 24px 64px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    @keyframes modalIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
        font-size: 15px; font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
        text-align: center;
    }
    .modal-sub {
        font-size: 11px; color: var(--text-dim);
        text-align: center;
        margin-bottom: 14px;
        line-height: 1.4;
    }
    .input-field {
        width: 100%;
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--border);
        border-radius: 11px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        font-weight: 700;
        padding: 12px 14px;
        text-align: center;
        letter-spacing: 0.06em;
        outline: none;
        transition: all 0.2s;
        text-transform: uppercase;
        margin-bottom: 12px;
    }
    .input-field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }
    .input-field::placeholder {
        color: var(--text-mute);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
    }
    .status-msg {
        font-size: 11px; font-weight: 700;

        border-radius: 12px;
        cursor: pointer;
        transition: 0.25s;

        width: 18px; height: 18px;

        background: var(--text-dim);
        border-radius: 50%;
        transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    .switch input:checked + .slider {
        background: linear-gradient(135deg, #fff, #d0d4ff);

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    /* ============== ИДЕНТИФИКАТОР ПОЛЬЗОВАТЕЛЯ ============== */
    const TG_USER = tg.initDataUnsafe?.user;
    const USER_ID = TG_USER?.id ? String(TG_USER.id) : 'guest_' + (localStorage.getItem('psygg_guest_id') || (() => {
        const id = 'g' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem('psygg_guest_id', id); } catch {}
        return id;
    })());
    const KEY_PREFIX = 'psygg_' + USER_ID + '_';

    console.log('[PSYgg] Telegram user:', TG_USER?.username || 'anonymous', '| user_id:', USER_ID);

    /* ============== ПРАВА АДМИНА ============== */
    const ADMIN_USERNAMES = ['xertex_grace', 'onyurknees', 'romasik09', 'malindak'];
    function isAdmin() {
        const u = TG_USER?.username;
        if (!u) return false;
        return ADMIN_USERNAMES.includes(u.toLowerCase());
    }

    /* ============== НАСТРОЙКИ ============== */
    const VIB_KEY = 'psygg_vibration';
    const SND_KEY = 'psygg_sound';
    const USED_KEY = KEY_PREFIX + 'used_promos';
    const HISTORY_KEY = KEY_PREFIX + 'history';
    const INV_KEY = KEY_PREFIX + 'inventory';
    const BALANCE_KEY = KEY_PREFIX + 'balance';
    const SPIN_SNAPSHOT_KEY = KEY_PREFIX + 'spin_snapshot';
    const INIT_KEY = KEY_PREFIX + 'initialized';

    let vibrationEnabled = localStorage.getItem(VIB_KEY) !== 'false';
    let soundEnabled = localStorage.getItem(SND_KEY) !== 'false';

    const PROMO_CODES = {
        'ROMANARMATURA777': { amount: 10 },
        'CHIHARDEDEP':      { amount: 20 }
    };

    function getUsedCodes() {
        try { return JSON.parse(localStorage.getItem(USED_KEY) || '[]'); }
        catch { return []; }
    }
    function markCodeUsed(code) {
        const u = getUsedCodes();
        if (!u.includes(code)) { u.push(code); localStorage.setItem(USED_KEY, JSON.stringify(u)); }
    }
    function isCodeUsed(code) { return getUsedCodes().includes(code); }

    /* ============== ЗВУКИ ============== */
    let audioCtx = null;
    function initAudio() {
        if (audioCtx) return;
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) {}
    }
    function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15, startDelay = 0) {
        if (!soundEnabled || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime + startDelay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + duration);
    }

    function iconHTML(item, size = 128) {

        const fragUrl = `https://nft.fragment.com/gift/${item.slug}.${size >= 128 ? 500 : 200}.webp`;

    function chanceFromRatio(r) {
        let c = 100 / r;
        if (c > 99) c = 99;
        if (c < 1) c = 1;
        return Math.round(c * 100) / 100;
    }
    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    function recomputeChance() {
        if (!currentItem || !targetItem) return;
        const r = targetItem.value / currentItem.value;
        chance = chanceFromRatio(r);
        multiplier = Math.round(r * 100) / 100;
        updatePercentUI();
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = chance.toFixed(2).replace(/\.00$/, '') + '%';
        $('wheel-label').textContent = chanceLabel(chance);
        updateArc();
        highlightMult();
    }

    function highlightMult() {
        document.querySelectorAll('.mult-btn').forEach(b => {
            const v = parseFloat(b.dataset.mult);
            b.classList.toggle('active', Math.abs(v - multiplier) < 0.15);
        });
    }

    function updateArc() {
        const arc = $('win-arc');
        const cx = 50, cy = 50;
        const half = Math.min(179.9, chance * 3.6 / 2);
        const a0 = 180 - half, a1 = 180 + half;
        const rad = d => d * Math.PI / 180;
        const large = (a1 - a0) > 180 ? 1 : 0;
        const ro = 49, ri = 39;
        const xo1 = cx + ro * Math.sin(rad(a0)), yo1 = cy - ro * Math.cos(rad(a0));
        const xo2 = cx + ro * Math.sin(rad(a1)), yo2 = cy - ro * Math.cos(rad(a1));
        const xi1 = cx + ri * Math.sin(rad(a0)), yi1 = cy - ri * Math.cos(rad(a0));
        const xi2 = cx + ri * Math.sin(rad(a1)), yi2 = cy - ri * Math.cos(rad(a1));
        arc.setAttribute('d', [
            `M ${xo1} ${yo1}`, `A ${ro} ${ro} 0 ${large} 1 ${xo2} ${yo2}`,
            `L ${xi2} ${yi2}`, `A ${ri} ${ri} 0 ${large} 0 ${xi1} ${yi1}`, 'Z'
        ].join(' '));
    }

            const his = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
            const bal = localStorage.getItem(BALANCE_KEY);
            if (Array.isArray(inv)) inventory = inv;
            if (Array.isArray(his)) history = his;
            if (bal !== null) balance = parseInt(bal, 10) || 0;
        } catch {}
    }
    function takeSpinSnapshot() {

                balance: balance,
                ts: Date.now()
            };
            localStorage.setItem(SPIN_SNAPSHOT_KEY, JSON.stringify(snap));
        } catch {}
    }
    function clearSpinSnapshot() {
        try { localStorage.removeItem(SPIN_SNAPSHOT_KEY); } catch {}
    }
    function restoreFromSnapshotIfAny() {
        try {
            const raw = localStorage.getItem(SPIN_SNAPSHOT_KEY);
            if (!raw) return false;
            const snap = JSON.parse(raw);
            if (snap && Array.isArray(snap.inventory)) {
                inventory = snap.inventory;
                balance = snap.balance || balance;
                localStorage.removeItem(SPIN_SNAPSHOT_KEY);
                return true;
            }
        } catch {}
        return false;
    }

    function hexToRgba(hex, alpha) {
        const h = hex.replace('#', '');
        const r = parseInt(h.substring(0, 2), 16);
        const g = parseInt(h.substring(2, 4), 16);
        const b = parseInt(h.substring(4, 6), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    function renderInventory() {
        const grid = $('inv-grid');
        grid.innerHTML = '';
        $('inv-count').textContent = `(${inventory.length})`;
        const list = inventory.filter(it => {
            if (invSearch && !it.name.toLowerCase().includes(invSearch.toLowerCase())) return false;
            if (invMin !== null && it.value < invMin) return false;
            if (invMax !== null && it.value > invMax) return false;
            return true;
        });
        if (!list.length) {
            grid.innerHTML = `<div class="empty">${inventory.length === 0 ? 'Пусто' : 'Не найдено'}</div>`;
            return;
        }
        list.forEach(item => {
            const rar = getRarity(item.value);
            const s = document.createElement('div');
            s.className = 'slot' + (item === currentItem ? ' selected' : '');
            s.style.setProperty('--rar-color', rar.raw);
            s.innerHTML = `<div class="slot-icon-sm">${iconHTML(item, 64)}</div><div class="slot-name">${item.name}</div><div class="slot-price">${item.value}⭐</div>`;
            s.onclick = () => {
                if (isSpinning) return;
                sndClick();
                currentItem = item;
                if (targetItem && targetItem.value <= currentItem.value) targetItem = null;
                renderInventory(); renderArena();
                if (targetItem) recomputeChance();
                updateBtn();
            };
            grid.appendChild(s);
        });
    }

    function activatePromo() {
        const code = $('promo-input').value.trim().toUpperCase();
        const msg = $('promo-message');
        msg.className = 'status-msg';
        if (!code) { msg.textContent = 'Введи промокод'; msg.classList.add('err'); sndError(); return; }
        const promo = PROMO_CODES[code];
        if (!promo) { msg.textContent = 'Неверный промокод'; msg.classList.add('err'); sndError(); if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error'); return; }
        if (isCodeUsed(code)) { msg.textContent = 'Уже активирован'; msg.classList.add('err'); sndError(); if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error'); return; }
        balance += promo.amount;
        $('balance').textContent = balance;
        markCodeUsed(code);
        saveState();
        msg.textContent = `+${promo.amount} ⭐`;
        msg.classList.add('ok');
        sndPromo();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
        confetti();
        renderShop();

        setTimeout(closePromo, 1200);

        $('profile-modal').classList.add('active');
    }
    $('profile-btn').onclick = () => { sndClick(); openProfile(); };
    $('profile-close').onclick = () => { sndClick(); $('profile-modal').classList.remove('active'); };

    document.querySelectorAll('.profile-tab').forEach(t => {
        t.onclick = () => {
            sndClick();
            document.querySelectorAll('.profile-tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.profile-view').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            $('pview-' + t.dataset.pview).classList.add('active');
        };
    });

    function renderHistory() {
        const el = $('history-list');
        if (!history.length) { el.innerHTML = '<div class="empty">Пока пусто</div>'; return; }
        el.innerHTML = history.slice(0, 30).map(h => {
            const time = new Date(h.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const icon = h.win ? iconHTML(h.to, 64) : iconHTML(h.from, 64);
            return `
                <div class="history-item">
                    <div class="history-icon">${icon}</div>
                    <div class="history-info">
                        <div class="history-name">${h.win ? h.to.name : h.from.name}</div>
                        <div class="history-sub">${h.win ? `+${h.to.value - h.from.value}` : `-${h.from.value}`} ⭐ · ${time}</div>
                    </div>
                    <div class="history-result ${h.win ? 'win' : 'lose'}">${h.win ? 'WIN' : 'LOSE'}</div>
                </div>
            `;
        }).join('');
    }

    function renderProfileInventory() {
        const el = $('profile-inv-list');
        if (!inventory.length) { el.innerHTML = '<div class="empty">Пусто</div>'; return; }
        el.innerHTML = inventory.map((item, idx) => `
            <div class="inv-item">
                <div class="history-icon">${iconHTML(item, 64)}</div>
                <div class="history-info">
                    <div class="history-name">${item.name}</div>
                    <div class="history-sub">${item.value} ⭐</div>
                </div>
                <div class="inv-actions">
                    <button class="mini-btn sell" data-sell="${idx}">Продать</button>
                    <button class="mini-btn withdraw" disabled title="Скоро">Вывод</button>
                </div>
            </div>
        `).join('');
        el.querySelectorAll('[data-sell]').forEach(btn => {
            btn.onclick = () => { const idx = parseInt(btn.dataset.sell, 10); sndClick(); openSell(idx); };
        });
    }

    let sellIdx = -1;
    function openSell(idx) {
        const item = inventory[idx];
        if (!item) return;
        sellIdx = idx;
        $('sell-icon').innerHTML = iconHTML(item, 128);
        $('sell-name').textContent = item.name;
        const price = Math.floor(item.value * 0.9);
        $('sell-info').innerHTML = `Продать за <b style="color: var(--gold);">${price} ⭐</b><br><span style="font-size: 9px;">(комиссия 10%)</span>`;
        $('sell-modal').classList.add('active');
    }
    function closeSell() { $('sell-modal').classList.remove('active'); sellIdx = -1; }
    $('sell-cancel').onclick = () => { sndClick(); closeSell(); };
    $('sell-confirm').onclick = () => {
        if (sellIdx < 0) return;
        const item = inventory[sellIdx];
        const price = Math.floor(item.value * 0.9);
        balance += price;
        $('balance').textContent = balance;
        if (currentItem === item) currentItem = null;
        inventory.splice(sellIdx, 1);
        saveState();
        sndBuy();
        closeSell();
        renderInventory(); renderArena(); renderShop(); updateBtn();
        renderProfileInventory();
        if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
    };

    function renderMult() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach(m => {
            const b = document.createElement('button');
            b.className = 'mult-btn';
            b.dataset.mult = m;
            const c = chanceFromRatio(m);
            b.innerHTML = `×${m}<span class="c">${c.toFixed(c < 10 ? 1 : 0)}%</span>`;
            b.onclick = () => {
                if (isSpinning || !currentItem) return;
                sndClick();
                const target = currentItem.value * m;
                const cands = CATALOG.filter(it => it.value > currentItem.value);
                if (!cands.length) return;
                const best = cands.reduce((p, c) => Math.abs(c.value - target) < Math.abs(p.value - target) ? c : p);
                targetItem = best;
                recomputeChance(); renderShop(); renderArena(); updateBtn();
            };
            grid.appendChild(b);
        });
    }

    function updateBtn() {
        $('upgrade-btn').disabled = isSpinning || !currentItem || !targetItem;
    }

    function confetti() {
        const colors = ['#fff', '#2ecc71', '#4a86ff', '#a855f7', '#ffd93d', '#ff4757', '#ff9500'];
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 80; i++) {
            const p = document.createElement('div');
            p.className = 'confetti';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = cx + 'px';
            p.style.top = cy + 'px';
            const a = Math.random() * Math.PI * 2;
            const v = 180 + Math.random() * 420;
            p.style.setProperty('--dx', Math.cos(a) * v + 'px');
            p.style.setProperty('--dy', (Math.sin(a) * v - 120) + 'px');
            p.style.animationDelay = (Math.random() * 0.15) + 's';
            if (Math.random() > 0.5) p.style.borderRadius = '50%';
            if (Math.random() > 0.7) p.style.boxShadow = `0 0 10px ${p.style.background}`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 2400);
        }
    }
    function flashRed() { const el = $('flash-red'); el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
    function flashWin() { const el = $('flash-win'); el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
    function shake() { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 600); }

    let hb = null, tensionTimer = null, tickInterval = null;

    function startSpin() {
        const s = $('stage');
        s.classList.remove('snap', 'tension');
        requestAnimationFrame(() => s.classList.add('zooming'));
        $('wheel-wrap').classList.add('spinning');
        sndSpinStart();

        const TICK_START = 150;
        const TICK_END = 35;
        const EFFECTIVE_DURATION = SPIN_DURATION - 500;
        let elapsed = 0;
        const tickLoop = () => {
            sndTick();
            elapsed += TICK_START - (TICK_START - TICK_END) * Math.min(1, elapsed / EFFECTIVE_DURATION);
            const progress = Math.min(1, elapsed / EFFECTIVE_DURATION);
            const delay = TICK_START - (TICK_START - TICK_END) * progress;
            if (elapsed < EFFECTIVE_DURATION) {
                tickInterval = setTimeout(tickLoop, delay);
            }
        };
        tickLoop();

        hb = setInterval(() => { if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('light'); }, 600);
        tensionTimer = setTimeout(() => {
            $('stage').classList.add('tension');
            clearInterval(hb);
            hb = setInterval(() => { if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('medium'); }, 140);
        }, SPIN_DURATION - 2400);
    }

    function endSpin(win) {
        clearInterval(hb); clearTimeout(tensionTimer); clearTimeout(tickInterval);
        hb = null; tensionTimer = null; tickInterval = null;
        const s = $('stage');
        s.classList.remove('zooming', 'tension');
        void s.offsetWidth;
        s.classList.add('snap');
        setTimeout(() => s.classList.remove('snap'), 550);
        $('wheel-wrap').classList.remove('spinning');
        if (vibrationEnabled) tg.HapticFeedback?.impactOccurred('heavy');
        if (win) sndWin(); else sndLose();
    }

    function spin(ch, predetWin) {
        return new Promise(resolve => {
            const p = $('wheel-pointer');
            const half = Math.min(179.9, ch * 3.6 / 2);
            const s0 = 180 - half, s1 = 180 + half;

            let angle;
            if (predetWin) {
                angle = s0 + 1 + Math.random() * (s1 - s0 - 2);
            } else {
                const out = 360 - (s1 - s0);
                let off = 1 + Math.random() * (out - 2);
                angle = s1 + off;
                if (angle > 360) angle -= 360;
            }

            const turns = 8 + Math.floor(Math.random() * 4);
            const total = turns * 360 + angle;
            p.style.transition = 'none';
            p.style.transform = 'rotate(0deg)';
            void p.offsetWidth;
            p.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.7, 0.15, 1)`;
            p.style.transform = `rotate(${total}deg)`;
            const fin = ((total % 360) + 360) % 360;
            const real = fin >= s0 && fin <= s1;
            setTimeout(() => resolve(real), SPIN_DURATION + 100);
        });
    }

    async function doUpgrade() {
        if (isSpinning || !currentItem || !targetItem) return;
        isSpinning = true;
        $('upgrade-btn').disabled = true;
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';

        const wantWin = Math.random() * 100 < chance;
        preDeterminedWin = wantWin;

        takeSpinSnapshot();

        startSpin();
        const win = await spin(chance, preDeterminedWin);
        endSpin(win);

        const idx = inventory.indexOf(currentItem);
        const fromCopy = { ...currentItem };
        const toCopy = { ...targetItem };

        if (win) {
            const newItem = { ...targetItem };
            inventory[idx] = newItem;
            currentItem = newItem;
            $('to-card').classList.add('win');
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
            flashWin();
            confetti();
            history.unshift({ win: true, from: fromCopy, to: toCopy, time: Date.now() });
        } else {
            inventory.splice(idx, 1);
            currentItem = inventory[0] || null;
            targetItem = null;
            $('to-card').classList.add('lose');
            if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('error');
            flashRed(); shake();
            history.unshift({ win: false, from: fromCopy, to: null, time: Date.now() });
        }
        history = history.slice(0, 50);

        clearSpinSnapshot();
        saveState();

        renderInventory(); renderArena(); renderShop();
        if (currentItem && targetItem) recomputeChance();
        else { chance = 50; multiplier = 2; updatePercentUI(); }
        setTimeout(() => { isSpinning = false; updateBtn(); }, 500);
    }

    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            sndClick();
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            $('view-' + t.dataset.tab).classList.add('active');
        };
    });

    function setupAdminPanel() {
        const admin = isAdmin();
        const chip = $('plus-btn');
        const sign = $('plus-sign');
        if (admin) {
            chip.classList.add('admin');
            sign.style.display = 'inline';
            chip.onclick = () => {
                sndClick();
                const input = prompt('Сколько монет добавить?', '10000');
                if (input === null) return;
                const amt = parseInt(input, 10);
                if (isNaN(amt) || amt <= 0) return;
                balance += amt;
                $('balance').textContent = balance;
                saveState();
                renderShop();
                if (vibrationEnabled) tg.HapticFeedback?.notificationOccurred('success');
            };
        } else {
            chip.classList.remove('admin');
            sign.style.display = 'none';
            chip.onclick = null;
        }
    }

    $('inv-search').addEventListener('input', e => { invSearch = e.target.value; renderInventory(); });
    $('inv-price-min').addEventListener('input', e => { const v = e.target.value.trim(); invMin = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('inv-price-max').addEventListener('input', e => { const v = e.target.value.trim(); invMax = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('shop-search').addEventListener('input', e => { shopSearch = e.target.value; renderShop(); });
    $('shop-price-min').addEventListener('input', e => { const v = e.target.value.trim(); shopMin = v === '' ? null : (parseFloat(v) || 0); renderShop(); });
    $('shop-price-max').addEventListener('input', e => { const v = e.target.value.trim(); shopMax = v === '' ? null : (parseFloat(v) || 0); renderShop(); });

    document.body.addEventListener('touchstart', initAudio, { once: true });
    document.body.addEventListener('click', initAudio, { once: true });

    async function init() {
        await loadCatalog();

        const restored = restoreFromSnapshotIfAny();
        if (restored) {
            console.log('[PSYgg] Восстановлен снимок после прерванного спина');
        } else {
            loadState();
        }

        // ФИКС: стартовый набор выдаём ТОЛЬКО при первом запуске пользователя.
        // Флаг INIT_KEY сохраняется навсегда. Если игрок всё проиграет —
        // инвентарь останется пустым, никаких "подарков с неба" больше не будет.
        const isFirstLaunch = !localStorage.getItem(INIT_KEY);

        if (isFirstLaunch) {
            console.log('[PSYgg] Первый запуск — выдаю стартовый набор');
            const pool = CATALOG.slice(0, Math.min(12, CATALOG.length));
            for (let i = 0; i < 8; i++) {
                inventory.push({ ...pool[Math.floor(Math.random() * pool.length)] });
            }
            balance = STARTING_BALANCE;
            localStorage.setItem(INIT_KEY, '1');
            saveState();
        } else {
            console.log('[PSYgg] Загружено сохранение. Инвентарь:', inventory.length, 'Баланс:', balance);
            if (isNaN(balance) || balance < 0) balance = 0;
        }

        $('balance').textContent = balance;

        currentItem = inventory[0] || null;
        targetItem = null;
        chance = 50;
        multiplier = 2;

        renderMult(); renderInventory(); renderArena(); renderShop();
        updatePercentUI(); updateBtn();
        setupAdminPanel();
    }

    init();
    $('upgrade-btn').onclick = doUpgrade;
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПСЫ.gg — Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
        --bg: #06060a;
        --panel: rgba(22, 22, 32, 0.72);
        --panel-border: rgba(255, 255, 255, 0.08);
        --panel-border-hover: rgba(255, 255, 255, 0.18);
        --accent-1: #4a86ff;
        --accent-2: #a855f7;
        --accent-3: #f5c518;
        --text: #ffffff;
        --text-dim: #9aa0b0;
        --text-mute: #5a6070;
        --green: #22c55e;
        --red: #ef4444;
        --radius: 16px;
        --radius-sm: 10px;
    }

    html, body { overflow-x: hidden; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        padding: 8px;
        min-height: 100vh;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }

    /* АНИМИРОВАННЫЙ ФОН */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 80% 50% at 20% 0%, rgba(74,134,255,0.25) 0%, transparent 50%),
            radial-gradient(ellipse 70% 50% at 100% 30%, rgba(168,85,247,0.20) 0%, transparent 50%),
            radial-gradient(ellipse 90% 60% at 50% 100%, rgba(245,197,24,0.10) 0%, transparent 50%);
        z-index: -2;
        pointer-events: none;
        animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(-2%, 2%); }
    }

    /* ШУМ ПОВЕРХ */
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
        opacity: 0.04;
        z-index: -1;
        pointer-events: none;
    }

    /* ХЕДЕР */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: var(--panel);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: var(--radius);
        margin-bottom: 8px;
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .logo {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1.5px;
        background: linear-gradient(135deg, #fff 0%, #b0b8ff 40%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        filter: drop-shadow(0 0 12px rgba(168,85,247,0.4));
    }
    .logo .dot { -webkit-text-fill-color: rgba(255,255,255,0.4); }

    .balance-wrap { display: flex; align-items: center; gap: 5px; }
    .balance {
        display: flex; align-items: center; gap: 4px;
        background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,220,240,0.9));
        color: #000;
        padding: 5px 12px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 4px 20px rgba(255,255,255,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
        letter-spacing: 0.3px;
    }
    .star-svg { width: 12px; height: 12px; filter: drop-shadow(0 0 4px rgba(245,197,24,0.6)); }
    .plus-btn {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4a86ff, #a855f7);
        color: #fff;
        border: none;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        line-height: 1;
        box-shadow: 0 4px 20px rgba(74,134,255,0.5);
        transition: transform 0.15s, box-shadow 0.2s;
    }
    .plus-btn:active { transform: scale(0.9); box-shadow: 0 2px 10px rgba(74,134,255,0.7); }

    /* АРЕНА */
    .arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 6px;
        align-items: stretch;
        margin-bottom: 8px;
    }

    .item-slot {
        background: var(--panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: var(--radius);
        padding: 18px 6px 10px 6px;
        text-align: center;
        border: 1px solid var(--panel-border);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 170px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .item-slot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 60%);
        pointer-events: none;
    }
    .item-slot.win {
        border-color: rgba(34,197,94,0.6);
        box-shadow: 0 0 40px rgba(34,197,94,0.5), 0 8px 32px rgba(0,0,0,0.4), inset 0 0 30px rgba(34,197,94,0.12);
    }
    .item-slot.win::before {
        background: radial-gradient(circle at 50% 50%, rgba(34,197,94,0.2) 0%, transparent 60%);
    }
    .item-slot.lose {
        border-color: rgba(239,68,68,0.6);
        box-shadow: 0 0 40px rgba(239,68,68,0.4), 0 8px 32px rgba(0,0,0,0.4), inset 0 0 30px rgba(239,68,68,0.12);
    }
    .item-slot.lose::before {
        background: radial-gradient(circle at 50% 50%, rgba(239,68,68,0.2) 0%, transparent 60%);
    }

    .slot-title {
        font-size: 8px;
        color: var(--text-mute);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 700;
        position: absolute;
        top: 8px; left: 0; right: 0;
    }
    .slot-icon {
        width: 78px; height: 78px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 6px;
        position: relative;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
    }
    .slot-icon img {
        width: 100%; height: 100%;
        object-fit: contain;
        animation: floaty 3s ease-in-out infinite;
    }
    @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }
    .item-name {
        font-size: 9px;
        color: #bcc2d4;
        margin-bottom: 3px;
        font-weight: 500;
        max-width: 100%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-value {
        font-size: 12px;
        font-weight: 900;
        background: linear-gradient(135deg, #fff, #c0c8ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.3px;
    }

    /* КОЛЕСО */
    .wheel-col {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 6px;
        min-width: 175px;
    }
    .wheel-wrap {
        position: relative;
        width: 175px; height: 175px;
    }
    .wheel-wrap::before {
        content: '';
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            rgba(74,134,255,0.35),
            rgba(168,85,247,0.35),
            rgba(245,197,24,0.3),
            rgba(74,134,255,0.35));
        filter: blur(16px);
        opacity: 0.7;
        animation: spinGlow 6s linear infinite;
        pointer-events: none;
        z-index: 0;
    }
    @keyframes spinGlow {
        to { transform: rotate(360deg); }
    }
    .wheel-svg {
        width: 100%; height: 100%;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 0 20px rgba(74,134,255,0.4));
    }
    .wheel-pointer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transition: transform 7.5s cubic-bezier(0.15, 0.7, 0.15, 1);
        z-index: 2;
    }
    .wheel-pointer::before {
        content: '';
        position: absolute;
        top: -6px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 14px solid #fff;
        filter: drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 20px rgba(168,85,247,0.8));
    }
    .wheel-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100px; height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 20%, #1c1c2a 0%, #06060a 100%);
        border: 1.5px solid rgba(255,255,255,0.15);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 3;
        box-shadow:
            0 0 30px rgba(74,134,255,0.3),
            inset 0 0 20px rgba(0,0,0,0.8),
            inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .wheel-percent {
        font-size: 26px;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #8fb0ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        letter-spacing: -0.5px;
        filter: drop-shadow(0 0 10px rgba(74,134,255,0.6));
    }
    .wheel-chance-label {
        font-size: 7px;
        color: var(--text-mute);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-top: 3px;
        font-weight: 700;
    }

    /* МНОЖИТЕЛИ */
    .multiplier-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
        margin-bottom: 8px;
    }
    .mult-btn {
        background: var(--panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        color: #fff;
        padding: 6px 1px;
        border-radius: 7px;
        font-size: 8px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        line-height: 1.05;
        position: relative;
        overflow: hidden;
    }
    .mult-btn:active { transform: scale(0.94); }
    .mult-btn.active {
        background: linear-gradient(135deg, #fff, #b0b8ff);
        border-color: #fff;
        color: #000;
        box-shadow: 0 4px 20px rgba(255,255,255,0.4), 0 0 30px rgba(74,134,255,0.4);
        transform: translateY(-1px);
    }
    .mult-btn .chance {
        display: block;
        font-size: 6px;
        color: var(--text-mute);
        font-weight: 600;
        margin-top: 1px;
    }
    .mult-btn.active .chance { color: rgba(0,0,0,0.65); }

    /* КНОПКА АПГРЕЙДА */
    .action-btn {
        display: block;
        width: 70%;
        margin: 0 auto 10px auto;
        padding: 12px;
        background: linear-gradient(135deg, #ffffff 0%, #d0d4ff 100%);
        border: none;
        border-radius: 12px;
        color: #000;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:
            0 8px 30px rgba(74,134,255,0.4),
            0 0 60px rgba(168,85,247,0.25),
            inset 0 1px 0 rgba(255,255,255,0.9);
        position: relative;
        overflow: hidden;
    }
    .action-btn::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        transition: left 0.6s;
    }
    .action-btn:hover::before { left: 100%; }
    .action-btn:active {
        transform: scale(0.97);
        box-shadow: 0 4px 15px rgba(74,134,255,0.5), inset 0 1px 0 rgba(255,255,255,0.9);
    }
    .action-btn:disabled {
        opacity: 0.35;
        box-shadow: none;
        cursor: not-allowed;
    }

    /* ПАНЕЛИ */
    .two-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
    }
    .panel {
        background: var(--panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: var(--radius);
        padding: 8px;
        border: 1px solid var(--panel-border);
        display: flex; flex-direction: column;
        max-height: 280px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .panel h4 {
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-mute);
        font-weight: 800;
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .panel-body { overflow-y: auto; flex: 1; }
    .panel-body::-webkit-scrollbar { width: 3px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* ПОИСК + ФИЛЬТР */
    .search-row {
        display: flex; align-items: center; gap: 4px;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 4px 7px;
        margin-bottom: 4px;
        transition: border 0.2s, box-shadow 0.2s;
    }
    .search-row:focus-within {
        border-color: rgba(74,134,255,0.6);
        box-shadow: 0 0 15px rgba(74,134,255,0.3);
    }
    .search-row svg { width: 10px; height: 10px; flex-shrink: 0; opacity: 0.5; }
    .search-row input {
        background: transparent; border: none;
        color: #fff; font-size: 9px;
        width: 100%; outline: none;
    }
    .search-row input::placeholder { color: var(--text-mute); }

    .price-row {
        display: flex; align-items: center;
        gap: 3px;
        margin-bottom: 5px;
    }
    .price-row span { font-size: 7px; color: var(--text-mute); text-transform: uppercase; font-weight: 700; }
    .price-row input {
        flex: 1; min-width: 0;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 9px;
        padding: 3px 5px;
        border-radius: 6px;
        outline: none;
        transition: border 0.2s;
    }
    .price-row input:focus { border-color: rgba(74,134,255,0.6); }

    /* СЕТКА */
    .item-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
    }
    .grid-slot {
        background: linear-gradient(160deg, rgba(30,30,42,0.9), rgba(18,18,26,0.9));
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 9px;
        padding: 6px 3px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    .grid-slot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 70%);
        pointer-events: none;
    }
    .grid-slot:active { transform: scale(0.94); }
    .grid-slot.selected {
        border-color: #fff;
        background: linear-gradient(160deg, rgba(74,134,255,0.2), rgba(168,85,247,0.15));
        box-shadow: 0 0 20px rgba(255,255,255,0.3), inset 0 0 20px rgba(74,134,255,0.15);
    }
    .grid-slot.disabled { opacity: 0.25; pointer-events: none; filter: grayscale(0.8); }
    .grid-slot .slot-icon-sm {
        width: 40px; height: 40px;
        margin: 0 auto 3px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }
    .grid-slot .slot-icon-sm img { width: 100%; height: 100%; object-fit: contain; }
    .grid-slot .gname {
        font-size: 7px;
        color: #bcc2d4;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-weight: 500;
    }
    .grid-slot .gval {
        font-size: 8px;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, #a0b0ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-top: 1px;
    }

    .empty-msg {
        text-align: center;
        color: var(--text-mute);
        font-size: 9px;
        padding: 14px 8px;
        grid-column: 1/-1;
    }

    /* МОДАЛКА */
    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: none;
        align-items: center; justify-content: center;
        z-index: 200;
        padding: 20px;
        animation: fadeIn 0.25s;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
        background: linear-gradient(160deg, #1c1c2a, #0e0e16);
        border-radius: 20px;
        padding: 22px;
        max-width: 280px; width: 100%;
        border: 1px solid rgba(255,255,255,0.12);
        text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    .modal .slot-icon { margin: 0 auto 12px; width: 90px; height: 90px; }
    .modal h3 { font-size: 15px; margin-bottom: 5px; font-weight: 800; letter-spacing: 0.3px; }
    .modal .price {
        font-size: 22px;
        font-weight: 900;
        margin-bottom: 18px;
        background: linear-gradient(135deg, #fff, #a0b0ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btn {
        flex: 1;
        padding: 12px;
        border-radius: 11px;
        border: none;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s;
        letter-spacing: 0.5px;
    }
    .modal-btn:active { transform: scale(0.96); }
    .modal-btn.buy {
        background: linear-gradient(135deg, #fff, #d0d4ff);
        color: #000;
        box-shadow: 0 4px 20px rgba(255,255,255,0.3);
    }
    .modal-btn.cancel {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-btn.buy:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ЭФФЕКТЫ */
    .confetti {
        position: fixed;
        width: 8px; height: 8px;
        border-radius: 2px;
        pointer-events: none;
        z-index: 999;
        animation: confetti-burst 1.8s cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
    }
    @keyframes confetti-burst {
        0% { transform: translate(0,0) rotate(0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0.3); opacity: 0; }
    }
    .flash-red {
        position: fixed; inset: 0;
        background: transparent;
        pointer-events: none;
        z-index: 998;
    }
    .flash-red.active { animation: flash-red-anim 0.7s; }
    @keyframes flash-red-anim {
        0% { background: rgba(239,68,68,0); }
        20% { background: rgba(239,68,68,0.5); }
        100% { background: rgba(239,68,68,0); }
    }
    .shake { animation: shake-anim 0.5s; }
    @keyframes shake-anim {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
    }

    .footer {
        text-align: center;
        margin-top: 10px;
        font-size: 8px;
        color: var(--text-mute);
        padding-bottom: 6px;
        letter-spacing: 0.5px;
    }
    .footer a {
        color: var(--text-dim);
        text-decoration: none;
        font-weight: 700;
    }

    @media (min-width: 500px) {
        .wheel-wrap { width: 220px; height: 220px; }
        .wheel-col { min-width: 220px; }
        .wheel-center { width: 125px; height: 125px; }
        .wheel-percent { font-size: 32px; }
        .wheel-chance-label { font-size: 9px; }
        .item-slot { min-height: 210px; padding: 22px 8px 14px 8px; }
        .slot-icon { width: 105px; height: 105px; }
        .item-name { font-size: 11px; }
        .item-value { font-size: 14px; }
        .slot-title { font-size: 10px; }
        .logo { font-size: 20px; }
        .balance { font-size: 13px; padding: 6px 14px; }
        .plus-btn { width: 32px; height: 32px; font-size: 20px; }
        .mult-btn { padding: 8px 2px; font-size: 10px; border-radius: 8px; }
        .mult-btn .chance { font-size: 7px; }
        .action-btn { padding: 14px; font-size: 14px; width: 65%; }
        .panel { max-height: 340px; padding: 10px; }
        .panel h4 { font-size: 10px; }
        .grid-slot .slot-icon-sm { width: 46px; height: 46px; }
        .grid-slot .gname { font-size: 8px; }
        .grid-slot .gval { font-size: 9px; }
    }
</style>
</head>
<body>

<div class="header">
    <div class="logo">ПСЫ<span class="dot">.</span>gg</div>
    <div class="balance-wrap">
        <div class="balance">
            <svg class="star-svg" viewBox="0 0 24 24" fill="#f5c518"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span id="balance">1000</span>
        </div>
        <button class="plus-btn" id="plus-btn">+</button>
    </div>
</div>

<div class="arena">
    <div class="item-slot" id="from-card">
        <div class="slot-title">Твой гифт</div>
        <div class="slot-icon" id="from-icon"></div>
        <div class="item-name" id="from-name">—</div>
        <div class="item-value" id="from-value">—</div>
    </div>
    <div class="wheel-col">
        <div class="wheel-wrap">
            <svg class="wheel-svg" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#a0b0ff" stop-opacity="1"/>
                    </linearGradient>
                    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a3a"/>
                        <stop offset="100%" stop-color="#0e0e16"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="44" fill="none" stroke="url(#trackGrad)" stroke-width="10"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="10"/>
                <path id="win-arc" fill="url(#winGrad)" opacity="0.95"/>
            </svg>
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center">
                <div class="wheel-percent" id="wheel-percent">50%</div>
                <div class="wheel-chance-label" id="wheel-label">средний</div>
            </div>
        </div>
    </div>
    <div class="item-slot" id="to-card">
        <div class="slot-title">Цель</div>
        <div class="slot-icon" id="to-icon"></div>
        <div class="item-name" id="to-name">—</div>
        <div class="item-value" id="to-value">—</div>
    </div>
</div>

<div class="multiplier-grid" id="mult-grid"></div>
<button class="action-btn" id="upgrade-btn">Прокачать</button>

<div class="two-cols">
    <div class="panel">
        <h4>Инвентарь <span id="inv-count"></span></h4>
        <div class="search-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="inv-search" placeholder="Поиск...">
        </div>
        <div class="price-row">
            <span>От</span>
            <input type="number" id="inv-price-min" placeholder="0">
            <span>До</span>
            <input type="number" id="inv-price-max" placeholder="∞">
        </div>
        <div class="panel-body">
            <div class="item-grid" id="inv-grid"></div>
        </div>
    </div>
    <div class="panel">
        <h4>Каталог</h4>
        <div class="search-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="cat-search" placeholder="Поиск...">
        </div>
        <div class="price-row">
            <span>От</span>
            <input type="number" id="cat-price-min" placeholder="0">
            <span>До</span>
            <input type="number" id="cat-price-max" placeholder="∞">
        </div>
        <div class="panel-body">
            <div class="item-grid" id="cat-grid"></div>
        </div>
    </div>
</div>

<div class="footer">
    powered by <a href="https://api.changes.tg" target="_blank">@GiftChanges</a>
</div>

<div class="modal-overlay" id="buy-modal">
    <div class="modal">
        <div class="slot-icon" id="buy-icon"></div>
        <h3 id="buy-name">—</h3>
        <div class="price" id="buy-price">—</div>
        <div class="modal-btns">
            <button class="modal-btn cancel" id="buy-cancel">Отмена</button>
            <button class="modal-btn buy" id="buy-confirm">Купить</button>
        </div>
    </div>
</div>
<div class="flash-red" id="flash-red"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const FALLBACK_CATALOG = [
        { name: 'Toy Bear', slug: 'toybear', value: 15 },
        { name: 'Heart Locket', slug: 'heartlocket', value: 25 },
        { name: 'Big Year', slug: 'bigyear', value: 40 },
        { name: 'Desk Calendar', slug: 'deskcalendar', value: 60 },
        { name: 'Jingle Bells', slug: 'jinglebells', value: 80 },
        { name: 'Homemade Cake', slug: 'homemadecake', value: 110 },
        { name: 'Eternal Rose', slug: 'eternalrose', value: 150 },
        { name: 'Magic Potion', slug: 'magicpotion', value: 200 },
        { name: 'Crystal Ball', slug: 'crystalball', value: 280 },
        { name: 'Top Hat', slug: 'tophat', value: 380 },
        { name: "Durov's Cap", slug: 'durovscap', value: 500 },
        { name: 'Diamond Ring', slug: 'diamondring', value: 700 },
        { name: 'Sakura Flower', slug: 'sakuraflower', value: 950 },
        { name: 'Jolly Chimp', slug: 'jollychimp', value: 1300 },
        { name: 'Plush Pepe', slug: 'plushpepe', value: 1800 },
        { name: 'Snoop Dogg', slug: 'snoopdogg', value: 2500 },
        { name: 'Swiss Watch', slug: 'swisswatch', value: 3500 },
        { name: 'Precious Peach', slug: 'preciouspeach', value: 5000 },
        { name: 'Signet Ring', slug: 'signetring', value: 7000 },
        { name: 'Santa Hat', slug: 'santahat', value: 10000 }
    ];

    const MULTIPLIERS = [1.2, 1.5, 2, 3, 5, 10, 25, 100];
    const SPIN_DURATION = 7500;

    let CATALOG = [];
    let balance = 1000;
    let inventory = [];
    let currentItem = null;
    let targetItem = null;
    let chance = 50;
    let multiplier = 2;
    let isSpinning = false;
    let invSearch = '', invPriceMin = null, invPriceMax = null;
    let catSearch = '', catPriceMin = null, catPriceMax = null;

    const $ = id => document.getElementById(id);

    async function loadGiftCatalog() {
        try {
            const response = await fetch('https://api.changes.tg/gifts');
            if (!response.ok) throw new Error('API error');
            const data = await response.json();
            CATALOG = data.map((item, index) => ({
                name: item.name || item.title || `Gift ${index}`,
                slug: (item.slug || item.name || '').toLowerCase().replace(/[^a-z0-9]/g, ''),
                value: item.value || item.price || (index + 1) * 50
            }));
        } catch (e) {
            CATALOG = [...FALLBACK_CATALOG];
        }
    }

    function giftImageUrl(item, size = 128) {
        return `https://nft.fragment.com/gift/${item.slug}.${size >= 128 ? 500 : 200}.webp`;
    }

    function iconHTML(item, size = 128) {
        const url = giftImageUrl(item, size);
        return `<img src="${url}" loading="lazy" alt="${item.name}" onerror="this.style.display='none'">`;
    }

    function setSlotIcon(slotEl, item, size = 128) {
        slotEl.innerHTML = iconHTML(item, size);
    }

    function chanceFromRatio(ratio) {
        let c = 100 / ratio;
        if (c > 99) c = 99;
        if (c < 1) c = 1;
        return Math.round(c * 100) / 100;
    }

    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    function recomputeChance() {
        if (!currentItem || !targetItem) return;
        const ratio = targetItem.value / currentItem.value;
        chance = chanceFromRatio(ratio);
        multiplier = Math.round(ratio * 100) / 100;
        updatePercentUI();
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = chance.toFixed(2).replace(/\.00$/, '') + '%';
        $('wheel-label').textContent = chanceLabel(chance);
        updateWinArc();
        highlightMultBtn();
    }

    function highlightMultBtn() {
        document.querySelectorAll('.mult-btn').forEach(b => {
            const v = parseFloat(b.dataset.mult);
            b.classList.toggle('active', Math.abs(v - multiplier) < 0.15);
        });
    }

    function updateWinArc() {
        const arc = $('win-arc');
        const cx = 50, cy = 50;
        const half = Math.min(179.9, chance * 3.6 / 2);
        const startAngle = 180 - half;
        const endAngle = 180 + half;
        const toRad = deg => (deg * Math.PI) / 180;
        const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
        const rOuter = 49, rInner = 39;
        const xo1 = cx + rOuter * Math.sin(toRad(startAngle));
        const yo1 = cy - rOuter * Math.cos(toRad(startAngle));
        const xo2 = cx + rOuter * Math.sin(toRad(endAngle));
        const yo2 = cy - rOuter * Math.cos(toRad(endAngle));
        const xi1 = cx + rInner * Math.sin(toRad(startAngle));
        const yi1 = cy - rInner * Math.cos(toRad(startAngle));
        const xi2 = cx + rInner * Math.sin(toRad(endAngle));
        const yi2 = cy - rInner * Math.cos(toRad(endAngle));
        const d = [
            `M ${xo1} ${yo1}`, `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${xo2} ${yo2}`,
            `L ${xi2} ${yi2}`, `A ${rInner} ${rInner} 0 ${largeArc} 0 ${xi1} ${yi1}`, 'Z'
        ].join(' ');
        arc.setAttribute('d', d);
    }

    function renderArena() {
        if (currentItem) {
            setSlotIcon($('from-icon'), currentItem);
            $('from-name').textContent = currentItem.name;
            $('from-value').textContent = currentItem.value + ' ⭐';
        } else {
            $('from-icon').innerHTML = '';
            $('from-name').textContent = 'Выбери из инвентаря';
            $('from-value').textContent = '—';
        }
        if (targetItem) {
            setSlotIcon($('to-icon'), targetItem);
            $('to-name').textContent = targetItem.name;
            $('to-value').textContent = targetItem.value + ' ⭐';
        } else {
            $('to-icon').innerHTML = '';
            $('to-name').textContent = 'Выбери цель';
            $('to-value').textContent = '—';
        }
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';
    }

    function renderInventory() {
        const grid = $('inv-grid');
        grid.innerHTML = '';
        $('inv-count').textContent = `(${inventory.length})`;
        const filtered = inventory.filter(it => {
            if (invSearch && !it.name.toLowerCase().includes(invSearch.toLowerCase())) return false;
            if (invPriceMin !== null && it.value < invPriceMin) return false;
            if (invPriceMax !== null && it.value > invPriceMax) return false;
            return true;
        });
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-msg">' + (inventory.length === 0 ? 'Пусто' : 'Не найдено') + '</div>';
            return;
        }
        filtered.forEach(item => {
            const slot = document.createElement('div');
            slot.className = 'grid-slot' + (item === currentItem ? ' selected' : '');
            slot.innerHTML = `<div class="slot-icon-sm">${iconHTML(item, 64)}</div><div class="gname">${item.name}</div><div class="gval">${item.value}⭐</div>`;
            slot.onclick = () => {
                if (isSpinning) return;
                currentItem = item;
                if (targetItem && targetItem.value <= currentItem.value) targetItem = null;
                renderInventory(); renderArena();
                if (targetItem) recomputeChance();
                updateUpgradeBtn();
            };
            grid.appendChild(slot);
        });
    }

    function renderCatalog() {
        const grid = $('cat-grid');
        grid.innerHTML = '';
        const filtered = CATALOG.filter(it => {
            if (catSearch && !it.name.toLowerCase().includes(catSearch.toLowerCase())) return false;
            if (catPriceMin !== null && it.value < catPriceMin) return false;
            if (catPriceMax !== null && it.value > catPriceMax) return false;
            return true;
        });
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-msg">Не найдено</div>';
            return;
        }
        filtered.forEach(item => {
            const slot = document.createElement('div');
            const isSelected = targetItem === item;
            const cantAfford = item.value > balance;
            slot.className = 'grid-slot' + (isSelected ? ' selected' : '');
            if (cantAfford) slot.classList.add('disabled');
            slot.innerHTML = `<div class="slot-icon-sm">${iconHTML(item, 64)}</div><div class="gname">${item.name}</div><div class="gval">${item.value}⭐</div>`;
            slot.onclick = () => { if (isSpinning) return; openBuyModal(item); };
            grid.appendChild(slot);
        });
    }

    let buyCandidate = null;
    function openBuyModal(item) {
        buyCandidate = item;
        setSlotIcon($('buy-icon'), item, 128);
        $('buy-name').textContent = item.name;
        $('buy-price').textContent = item.value + ' ⭐';
        $('buy-confirm').disabled = item.value > balance;
        $('buy-modal').classList.add('active');
    }
    function closeBuyModal() { $('buy-modal').classList.remove('active'); buyCandidate = null; }
    $('buy-cancel').onclick = closeBuyModal;
    $('buy-confirm').onclick = () => {
        if (!buyCandidate || buyCandidate.value > balance) return;
        balance -= buyCandidate.value;
        $('balance').textContent = balance;
        inventory.push({ ...buyCandidate });
        if (!currentItem) currentItem = inventory[inventory.length - 1];
        closeBuyModal(); renderInventory(); renderArena(); renderCatalog(); updateUpgradeBtn();
        tg.HapticFeedback?.notificationOccurred('success');
    };

    function renderMultipliers() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'mult-btn';
            btn.dataset.mult = m;
            const c = chanceFromRatio(m);
            btn.innerHTML = `×${m}<span class="chance">${c.toFixed(c < 10 ? 1 : 0)}%</span>`;
            btn.onclick = () => {
                if (isSpinning || !currentItem) return;
                const targetValue = currentItem.value * m;
                const candidates = CATALOG.filter(it => it.value > currentItem.value);
                if (candidates.length === 0) return;
                const best = candidates.reduce((prev, curr) => Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev);
                targetItem = best;
                recomputeChance(); renderCatalog(); renderArena(); updateUpgradeBtn();
            };
            grid.appendChild(btn);
        });
    }

    function updateUpgradeBtn() { $('upgrade-btn').disabled = isSpinning || !currentItem || !targetItem; }

    function burstConfetti() {
        const colors = ['#fff', '#f5c518', '#22c55e', '#4a86ff', '#a855f7', '#ef4444', '#ff6b9d'];
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 70; i++) {
            const p = document.createElement('div');
            p.className = 'confetti';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = cx + 'px'; p.style.top = cy + 'px';
            const a = Math.random() * Math.PI * 2;
            const v = 180 + Math.random() * 400;
            p.style.setProperty('--dx', Math.cos(a) * v + 'px');
            p.style.setProperty('--dy', (Math.sin(a) * v - 120) + 'px');
            p.style.animationDelay = (Math.random() * 0.15) + 's';
            if (Math.random() > 0.5) p.style.borderRadius = '50%';
            if (Math.random() > 0.7) p.style.boxShadow = '0 0 8px currentColor';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 2400);
        }
    }
    function flashRed() { const el = $('flash-red'); el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
    function shakeBody() { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 600); }

    function spinWheel(chanceVal) {
        return new Promise(resolve => {
            const pointer = $('wheel-pointer');
            const half = Math.min(179.9, chanceVal * 3.6 / 2);
            const sectorStart = 180 - half;
            const sectorEnd = 180 + half;
            const wantWin = Math.random() * 100 < chanceVal;
            let targetAngle;
            if (wantWin) { targetAngle = sectorStart + 1 + Math.random() * (sectorEnd - sectorStart - 2); }
            else { const outsideSize = 360 - (sectorEnd - sectorStart); let offset = 1 + Math.random() * (outsideSize - 2); targetAngle = sectorEnd + offset; if (targetAngle > 360) targetAngle -= 360; }
            const turns = 8 + Math.floor(Math.random() * 4);
            const totalAngle = turns * 360 + targetAngle;
            pointer.style.transition = 'none'; pointer.style.transform = 'rotate(0deg)';
            void pointer.offsetWidth;
            pointer.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.7, 0.15, 1)`;
            pointer.style.transform = `rotate(${totalAngle}deg)`;
            const finalAngle = ((totalAngle % 360) + 360) % 360;
            const realWin = finalAngle >= sectorStart && finalAngle <= sectorEnd;
            setTimeout(() => resolve(realWin), SPIN_DURATION + 100);
        });
    }

    async function doUpgrade() {
        if (isSpinning || !currentItem || !targetItem) return;
        isSpinning = true; $('upgrade-btn').disabled = true;
        $('from-card').className = 'item-slot'; $('to-card').className = 'item-slot';
        const win = await spinWheel(chance);
        const curIdx = inventory.indexOf(currentItem);
        if (win) {
            const newItem = { ...targetItem };
            inventory[curIdx] = newItem; currentItem = newItem;
            $('to-card').classList.add('win');
            tg.HapticFeedback?.notificationOccurred('success'); burstConfetti();
        } else {
            inventory.splice(curIdx, 1); currentItem = inventory[0] || null; targetItem = null;
            $('to-card').classList.add('lose');
            tg.HapticFeedback?.notificationOccurred('error'); flashRed(); shakeBody();
        }
        renderInventory(); renderArena(); renderCatalog();
        if (currentItem && targetItem) recomputeChance();
        else { chance = 50; multiplier = 2; updatePercentUI(); }
        setTimeout(() => { isSpinning = false; updateUpgradeBtn(); }, 500);
    }

    $('plus-btn').onclick = () => {
        const input = prompt('Сколько монет добавить?', '1000');
        if (input === null) return;
        const amount = parseInt(input, 10);
        if (isNaN(amount) || amount <= 0) return;
        balance += amount; $('balance').textContent = balance; renderCatalog();
        tg.HapticFeedback?.notificationOccurred('success');
    };

    $('inv-search').addEventListener('input', e => { invSearch = e.target.value; renderInventory(); });
    $('inv-price-min').addEventListener('input', e => { const v = e.target.value.trim(); invPriceMin = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('inv-price-max').addEventListener('input', e => { const v = e.target.value.trim(); invPriceMax = v === '' ? null : (parseFloat(v) || 0); renderInventory(); });
    $('cat-search').addEventListener('input', e => { catSearch = e.target.value; renderCatalog(); });
    $('cat-price-min').addEventListener('input', e => { const v = e.target.value.trim(); catPriceMin = v === '' ? null : (parseFloat(v) || 0); renderCatalog(); });
    $('cat-price-max').addEventListener('input', e => { const v = e.target.value.trim(); catPriceMax = v === '' ? null : (parseFloat(v) || 0); renderCatalog(); });

    async function initGame() {
        await loadGiftCatalog();
        const pool = CATALOG.slice(0, Math.min(12, CATALOG.length));
        inventory = [];
        for (let i = 0; i < 8; i++) {
            const item = pool[Math.floor(Math.random() * pool.length)];
            inventory.push({ ...item });
        }
        currentItem = inventory[0];
        targetItem = null; chance = 50; multiplier = 2;
        renderMultipliers(); renderInventory(); renderArena(); renderCatalog();
        updatePercentUI(); updateUpgradeBtn();
    }

    initGame();
    $('upgrade-btn').onclick = doUpgrade;
</script>
</body>
</html>

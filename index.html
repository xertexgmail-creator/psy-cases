<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПСЫ.gg — Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 10px; min-height: 100vh; overflow-x: hidden; }

    /* ХЕДЕР */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #151515; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    .logo .dot { color: #888; }
    .balance { display: flex; align-items: center; gap: 5px; background: #fff; color: #000; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 800; }
    .star-svg { width: 14px; height: 14px; }

    /* АРЕНА */
    .arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-bottom: 10px; }
    .item-slot { background: #151515; border-radius: 14px; padding: 22px 8px 14px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .item-slot.win { border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.35); }
    .item-slot.lose { border-color: #555; box-shadow: 0 0 25px rgba(100,100,100,0.35); }
    .slot-title { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; position: absolute; top: 10px; left: 0; right: 0; }
    .slot-icon { width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; position: relative; }
    .slot-icon .emoji-fb { font-size: 68px; line-height: 1; }
    .slot-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 12px rgba(255,255,255,0.25)); }
    .item-name { font-size: 12px; color: #ccc; margin-bottom: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-value { font-size: 15px; font-weight: 800; color: #fff; }

    /* КОЛЕСО */
    .wheel-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 210px; }
    .wheel-wrap { position: relative; width: 210px; height: 210px; }
    .wheel-svg { width: 100%; height: 100%; }
    .wheel-pointer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 7.5s cubic-bezier(0.15, 0.7, 0.15, 1); }
    .wheel-pointer::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid #fff; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }
    .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 118px; height: 118px; border-radius: 50%; background: #0a0a0a; border: 2px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3; }
    .wheel-percent { font-size: 28px; font-weight: 900; color: #fff; line-height: 1; }
    .wheel-chance-label { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    /* КНОПКИ × */
    .multiplier-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 10px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .mult-btn { background: #151515; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 2px; border-radius: 6px; font-size: 9px; font-weight: 800; cursor: pointer; transition: all 0.2s; line-height: 1.1; }
    .mult-btn.active { background: #fff; border-color: #fff; color: #000; }
    .mult-btn .chance { display: block; font-size: 7px; color: #888; font-weight: 500; margin-top: 1px; }
    .mult-btn.active .chance { color: rgba(0,0,0,0.6); }

    /* КНОПКА АПГРЕЙДА */
    .action-btn { display: block; width: 55%; margin: 0 auto 12px auto; padding: 13px; background: #fff; border: none; border-radius: 12px; color: #000; font-size: 14px; font-weight: 900; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.35; }

    /* НИЖНИЕ ПАНЕЛИ */
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel { background: #151515; border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; max-height: 340px; }
    .panel h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 8px; flex-shrink: 0; }
    .panel-body { overflow-y: auto; flex: 1; }

    /* ПОИСК + ФИЛЬТР */
    .search-row { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
    .search-row svg { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.5; }
    .search-row input { background: transparent; border: none; color: #fff; font-size: 11px; width: 100%; outline: none; }
    .search-row input::placeholder { color: #555; }
    .price-row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .price-row span { font-size: 9px; color: #666; text-transform: uppercase; }
    .price-row input { flex: 1; min-width: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 10px; padding: 4px 6px; border-radius: 6px; outline: none; }

    /* СЕТКА ПРЕДМЕТОВ */
    .item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .grid-slot { background: #1c1c1c; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
    .grid-slot:active { transform: scale(0.96); }
    .grid-slot.active { border-color: #fff; background: rgba(255,255,255,0.08); }
    .grid-slot.selected { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .grid-slot .slot-icon-sm { width: 44px; height: 44px; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; position: relative; }
    .grid-slot .slot-icon-sm .emoji-fb { font-size: 28px; line-height: 1; }
    .grid-slot .slot-icon-sm img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .grid-slot .gname { font-size: 8px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid-slot .gval { font-size: 9px; color: #fff; font-weight: 700; margin-top: 2px; }
    .grid-slot .count-badge { position: absolute; top: 3px; right: 3px; background: #fff; color: #000; font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 6px; }

    .empty-msg { text-align: center; color: #555; font-size: 11px; padding: 20px 10px; }

    .footer { text-align: center; margin-top: 14px; font-size: 9px; color: #555; padding-bottom: 8px; }
    .footer a { color: #fff; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
    <div class="logo">ПСЫ<span class="dot">.</span>gg</div>
    <div class="balance">
        <svg class="star-svg" viewBox="0 0 24 24" fill="#f5c518"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="balance">1000</span>
    </div>
</div>

<div class="arena">
    <div class="item-slot" id="from-card">
        <div class="slot-title">Твой гифт</div>
        <div class="slot-icon" id="from-icon"></div>
        <div class="item-name" id="from-name">—</div>
        <div class="item-value" id="from-value">—</div>
    </div>

    <div class="wheel-col">
        <div class="wheel-wrap">
            <svg class="wheel-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
                <path id="win-arc" fill="#fff" opacity="0.85"/>
            </svg>
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center">
                <div class="wheel-percent" id="wheel-percent">50%</div>
                <div class="wheel-chance-label" id="wheel-label">средний</div>
            </div>
        </div>
    </div>

    <div class="item-slot" id="to-card">
        <div class="slot-title">Цель</div>
        <div class="slot-icon" id="to-icon"></div>
        <div class="item-name" id="to-name">—</div>
        <div class="item-value" id="to-value">—</div>
    </div>
</div>

<div class="multiplier-grid" id="mult-grid"></div>

<button class="action-btn" id="upgrade-btn">Прокачать</button>

<div class="two-cols">
    <div class="panel">
        <h4>Инвентарь <span id="inv-count"></span></h4>
        <div class="panel-body">
            <div class="item-grid" id="inv-grid"></div>
        </div>
    </div>
    <div class="panel">
        <h4>Каталог</h4>
        <div class="search-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="search-input" placeholder="Поиск...">
        </div>
        <div class="price-row">
            <span>От</span>
            <input type="number" id="price-min" placeholder="0">
            <span>До</span>
            <input type="number" id="price-max" placeholder="∞">
        </div>
        <div class="panel-body">
            <div class="item-grid" id="cat-grid"></div>
        </div>
    </div>
</div>

<div class="footer">
    powered by <a href="https://api.changes.tg" target="_blank">@GiftChanges</a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ====== КАТАЛОГ ГИФТОВ (с эмодзи-fallback) ======
    const CATALOG = [
        { api: 'Heart',       name: 'Heart',       value: 15,   emoji: '❤️' },
        { api: 'TeddyBear',   name: 'Teddy Bear',  value: 25,   emoji: '🧸' },
        { api: 'Present',     name: 'Present',     value: 50,   emoji: '🎁' },
        { api: 'Rose',        name: 'Rose',        value: 75,   emoji: '🌹' },
        { api: 'Cake',        name: 'Cake',        value: 100,  emoji: '🎂' },
        { api: 'Bouquet',     name: 'Bouquet',     value: 150,  emoji: '💐' },
        { api: 'Rocket',      name: 'Rocket',      value: 200,  emoji: '🚀' },
        { api: 'Champagne',   name: 'Champagne',   value: 300,  emoji: '🍾' },
        { api: 'Trophy',      name: 'Trophy',      value: 450,  emoji: '🏆' },
        { api: 'Crown',       name: 'Crown',       value: 650,  emoji: '👑' },
        { api: 'Ring',        name: 'Ring',        value: 900,  emoji: '💍' },
        { api: 'Diamond',     name: 'Diamond',     value: 1200, emoji: '💎' },
        { api: 'JollyChimp',  name: 'Jolly Chimp', value: 1800, emoji: '🐵' },
        { api: 'PlushPepe',   name: 'Plush Pepe',  value: 2500, emoji: '🐸' },
        { api: 'SnoopDogg',   name: 'Snoop Dogg',  value: 3500, emoji: '🐶' },
        { api: 'SwissWatch',  name: 'Swiss Watch', value: 5000, emoji: '⌚' }
    ];

    const MULTIPLIERS = [1.2, 1.5, 2, 3, 5, 10, 25, 100];
    const SPIN_DURATION = 7500;

    // ====== СОСТОЯНИЕ ======
    let balance = 1000;
    let inventory = [];      // массив предметов во владении (у каждого уникальный id)
    let currentItem = null;  // выбранный из инвентаря
    let targetItem = null;   // выбранная цель из каталога
    let chance = 50;         // текущий шанс
    let multiplier = 2;      // текущий × (производное от chance)
    let isSpinning = false;
    let searchQuery = '';
    let priceMin = null;
    let priceMax = null;

    const $ = id => document.getElementById(id);

    // ====== ИКОНКА ======
    function iconHTML(item, size = 128) {
        const url = `https://api.changes.tg/original/${item.api}.png?size=${size}`;
        return `<span class="emoji-fb">${item.emoji}</span>
                <img src="${url}" onerror="this.style.display='none'" alt="">`;
    }

    function setSlotIcon(slotEl, item) {
        slotEl.innerHTML = iconHTML(item, 128);
    }

    // ====== ВСПОМОГАТЕЛЬНЫЕ ======
    function chanceFromRatio(ratio) {
        // chance = 100 / ratio, ограничен 1..99
        let c = 100 / ratio;
        if (c > 99) c = 99;
        if (c < 1) c = 1;
        return Math.round(c * 100) / 100;
    }

    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    function recomputeChance() {
        if (!currentItem || !targetItem) return;
        const ratio = targetItem.value / currentItem.value;
        chance = chanceFromRatio(ratio);
        multiplier = Math.round((targetItem.value / currentItem.value) * 100) / 100;
        updatePercentUI();
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = chance.toFixed(2).replace(/\.00$/, '') + '%';
        $('wheel-label').textContent = chanceLabel(chance);
        updateWinArc();
        highlightMultBtn();
    }

    function highlightMultBtn() {
        document.querySelectorAll('.mult-btn').forEach(b => {
            const v = parseFloat(b.dataset.mult);
            b.classList.toggle('active', Math.abs(v - multiplier) < 0.15);
        });
    }

    function updateWinArc() {
        const arc = $('win-arc');
        const cx = 50, cy = 50;
        const half = Math.min(179.9, chance * 3.6 / 2);
        const startAngle = 180 - half;
        const endAngle = 180 + half;
        const toRad = deg => (deg * Math.PI) / 180;
        const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
        const rOuter = 49, rInner = 39;

        const xo1 = cx + rOuter * Math.sin(toRad(startAngle));
        const yo1 = cy - rOuter * Math.cos(toRad(startAngle));
        const xo2 = cx + rOuter * Math.sin(toRad(endAngle));
        const yo2 = cy - rOuter * Math.cos(toRad(endAngle));
        const xi1 = cx + rInner * Math.sin(toRad(startAngle));
        const yi1 = cy - rInner * Math.cos(toRad(startAngle));
        const xi2 = cx + rInner * Math.sin(toRad(endAngle));
        const yi2 = cy - rInner * Math.cos(toRad(endAngle));

        const d = [
            `M ${xo1} ${yo1}`,
            `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${xo2} ${yo2}`,
            `L ${xi2} ${yi2}`,
            `A ${rInner} ${rInner} 0 ${largeArc} 0 ${xi1} ${yi1}`,
            'Z'
        ].join(' ');
        arc.setAttribute('d', d);
    }

    // ====== АРЕНА ======
    function renderArena() {
        if (currentItem) {
            setSlotIcon($('from-icon'), currentItem);
            $('from-name').textContent = currentItem.name;
            $('from-value').textContent = currentItem.value + ' ⭐';
        } else {
            $('from-icon').innerHTML = '<span class="emoji-fb">❓</span>';
            $('from-name').textContent = 'Выбери из инвентаря';
            $('from-value').textContent = '—';
        }
        if (targetItem) {
            setSlotIcon($('to-icon'), targetItem);
            $('to-name').textContent = targetItem.name;
            $('to-value').textContent = targetItem.value + ' ⭐';
        } else {
            $('to-icon').innerHTML = '<span class="emoji-fb">🎯</span>';
            $('to-name').textContent = 'Выбери цель';
            $('to-value').textContent = '—';
        }
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';
    }

    // ====== ИНВЕНТАРЬ ======
    function renderInventory() {
        const grid = $('inv-grid');
        grid.innerHTML = '';
        $('inv-count').textContent = `(${inventory.length})`;

        if (inventory.length === 0) {
            grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">Инвентарь пуст. Начни заново.</div>';
            return;
        }

        inventory.forEach(item => {
            const slot = document.createElement('div');
            slot.className = 'grid-slot' + (item === currentItem ? ' selected' : '');
            slot.innerHTML = `
                <div class="slot-icon-sm">${iconHTML(item, 64)}</div>
                <div class="gname">${item.name}</div>
                <div class="gval">${item.value}⭐</div>
            `;
            slot.onclick = () => {
                if (isSpinning) return;
                currentItem = item;
                if (targetItem && targetItem.value <= currentItem.value) targetItem = null;
                renderInventory();
                renderArena();
                if (targetItem) recomputeChance();
                updateUpgradeBtn();
            };
            grid.appendChild(slot);
        });
    }

    // ====== КАТАЛОГ ======
    function renderCatalog() {
        const grid = $('cat-grid');
        grid.innerHTML = '';

        const q = searchQuery.trim().toLowerCase();
        const filtered = CATALOG.filter(it => {
            if (q && !it.name.toLowerCase().includes(q)) return false;
            if (priceMin !== null && it.value < priceMin) return false;
            if (priceMax !== null && it.value > priceMax) return false;
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">Ничего не найдено</div>';
            return;
        }

        filtered.forEach(item => {
            const slot = document.createElement('div');
            const isSelected = targetItem === item;
            const disabled = currentItem && item.value <= currentItem.value;
            slot.className = 'grid-slot' + (isSelected ? ' selected' : '');
            if (disabled) slot.style.opacity = '0.3';
            slot.innerHTML = `
                <div class="slot-icon-sm">${iconHTML(item, 64)}</div>
                <div class="gname">${item.name}</div>
                <div class="gval">${item.value}⭐</div>
            `;
            slot.onclick = () => {
                if (isSpinning || disabled) return;
                targetItem = item;
                recomputeChance();
                renderCatalog();
                renderArena();
                updateUpgradeBtn();
            };
            grid.appendChild(slot);
        });
    }

    // ====== МНОЖИТЕЛИ ======
    function renderMultipliers() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'mult-btn';
            btn.dataset.mult = m;
            const c = chanceFromRatio(m);
            btn.innerHTML = `×${m}<span class="chance">${c.toFixed(c < 10 ? 1 : 0)}%</span>`;
            btn.onclick = () => {
                if (isSpinning || !currentItem) return;
                // Найти подходящий предмет в каталоге
                const targetValue = currentItem.value * m;
                const candidates = CATALOG.filter(it => it.value > currentItem.value);
                if (candidates.length === 0) return;
                const best = candidates.reduce((prev, curr) =>
                    Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
                );
                targetItem = best;
                recomputeChance();
                renderCatalog();
                renderArena();
                updateUpgradeBtn();
            };
            grid.appendChild(btn);
        });
    }

    function updateUpgradeBtn() {
        $('upgrade-btn').disabled = isSpinning || !currentItem || !targetItem;
    }

    // ====== КОЛЕСО ======
    function spinWheel(chanceVal) {
        return new Promise(resolve => {
            const pointer = $('wheel-pointer');
            const half = Math.min(179.9, chanceVal * 3.6 / 2);
            const sectorStart = 180 - half;
            const sectorEnd = 180 + half;

            const wantWin = Math.random() * 100 < chanceVal;
            let targetAngle;
            if (wantWin) {
                targetAngle = sectorStart + 1 + Math.random() * (sectorEnd - sectorStart - 2);
            } else {
                const outsideSize = 360 - (sectorEnd - sectorStart);
                let offset = 1 + Math.random() * (outsideSize - 2);
                targetAngle = sectorEnd + offset;
                if (targetAngle > 360) targetAngle -= 360;
            }

            const turns = 8 + Math.floor(Math.random() * 4);
            const totalAngle = turns * 360 + targetAngle;

            pointer.style.transition = 'none';
            pointer.style.transform = 'rotate(0deg)';
            void pointer.offsetWidth;

            pointer.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.7, 0.15, 1)`;
            pointer.style.transform = `rotate(${totalAngle}deg)`;

            const finalAngle = ((totalAngle % 360) + 360) % 360;
            const realWin = finalAngle >= sectorStart && finalAngle <= sectorEnd;

            setTimeout(() => resolve(realWin), SPIN_DURATION + 100);
        });
    }

    async function doUpgrade() {
        if (isSpinning || !currentItem || !targetItem) return;

        isSpinning = true;
        $('upgrade-btn').disabled = true;
        $('from-card').className = 'item-slot';
        $('to-card').className = 'item-slot';

        const win = await spinWheel(chance);

        const curIdx = inventory.indexOf(currentItem);

        if (win) {
            // Заменяем текущий предмет на цель
            const newItem = { ...targetItem };
            inventory[curIdx] = newItem;
            currentItem = newItem;

            $('to-card').classList.add('win');
            tg.HapticFeedback?.notificationOccurred('success');
        } else {
            // Удаляем предмет из инвентаря
            inventory.splice(curIdx, 1);
            currentItem = inventory[0] || null;
            targetItem = null;

            $('to-card').classList.add('lose');
            tg.HapticFeedback?.notificationOccurred('error');
        }

        renderInventory();
        renderArena();
        renderCatalog();
        if (currentItem && targetItem) recomputeChance();
        else { chance = 50; multiplier = 2; updatePercentUI(); }

        setTimeout(() => {
            isSpinning = false;
            updateUpgradeBtn();
        }, 500);
    }

    // ====== ПОИСК / ФИЛЬТР ======
    $('search-input').addEventListener('input', e => {
        searchQuery = e.target.value;
        renderCatalog();
    });
    $('price-min').addEventListener('input', e => {
        const v = e.target.value.trim();
        priceMin = v === '' ? null : parseFloat(v) || 0;
        renderCatalog();
    });
    $('price-max').addEventListener('input', e => {
        const v = e.target.value.trim();
        priceMax = v === '' ? null : parseFloat(v) || 0;
        renderCatalog();
    });

    // ====== СТАРТ ======
    function initGame() {
        // Дать игроку 10 случайных предметов из первых 12
        const pool = CATALOG.slice(0, 12);
        inventory = [];
        for (let i = 0; i < 10; i++) {
            const item = pool[Math.floor(Math.random() * pool.length)];
            inventory.push({ ...item });
        }
        currentItem = inventory[0];
        targetItem = null;
        chance = 50;
        multiplier = 2;
        balance = 1000;
        $('balance').textContent = balance;
    }

    function restartGame() {
        initGame();
        renderInventory();
        renderArena();
        renderCatalog();
        updatePercentUI();
        updateUpgradeBtn();
    }

    initGame();
    renderMultipliers();
    renderInventory();
    renderArena();
    renderCatalog();
    updatePercentUI();
    updateUpgradeBtn();

    $('upgrade-btn').onclick = doUpgrade;

    // Авто-рестарт если инвентарь пуст
    const origRenderInv = renderInventory;
    renderInventory = function() {
        origRenderInv();
        if (inventory.length === 0 && !isSpinning) {
            setTimeout(() => {
                if (confirm('Инвентарь пуст. Начать заново?')) restartGame();
            }, 300);
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПСЫ.gg — Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background: #0a0a0a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 12px;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px;
        background: #151515;
        border-radius: 12px;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
        font-size: 18px; font-weight: 900; letter-spacing: 1px;
        color: #fff;
        text-transform: uppercase;
    }
    .logo .dot { color: #888; }
    .balance {
        background: #ffffff;
        color: #000;
        padding: 6px 14px; border-radius: 16px;
        font-size: 13px; font-weight: 800;
    }

    .arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        align-items: stretch;
        margin-bottom: 12px;
    }
    .item-slot {
        background: #151515;
        border-radius: 14px;
        padding: 22px 8px 14px 8px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.08);
        transition: all 0.3s;
        min-height: 190px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        position: relative;
    }
    .item-slot.win { border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.3); }
    .item-slot.lose { border-color: #555; box-shadow: 0 0 25px rgba(100,100,100,0.3); }

    .slot-title {
        font-size: 10px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        position: absolute;
        top: 10px; left: 0; right: 0;
    }

    .item-img {
        width: 84px; height: 84px;
        object-fit: contain;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        transition: all 0.3s;
    }
    .item-name {
        font-size: 11px;
        color: #ccc;
        margin-bottom: 4px;
        line-height: 1.2;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .item-value {
        font-size: 14px;
        font-weight: 800;
        color: #fff;
    }

    .wheel-col {
        display: flex; flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 170px;
    }

    .wheel-wrap {
        position: relative;
        width: 170px; height: 170px;
    }
    .wheel-svg { width: 100%; height: 100%; }
    .wheel-pointer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transition: transform 7.5s cubic-bezier(0.15, 0.7, 0.15, 1);
    }
    .wheel-pointer::before {
        content: '';
        position: absolute;
        top: -4px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 16px solid #fff;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.7));
    }

    .wheel-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 95px; height: 95px;
        border-radius: 50%;
        background: #0a0a0a;
        border: 2px solid rgba(255,255,255,0.15);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 3;
    }
    .wheel-percent {
        font-size: 26px;
        font-weight: 900;
        color: #fff;
        line-height: 1;
    }
    .wheel-chance-label {
        font-size: 9px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 3px;
    }

    .mini-scales {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        width: 100%;
    }
    .mini-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
    }
    .mini-row .label {
        color: #666;
        min-width: 32px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    .mini-bar {
        flex: 1;
        height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px;
        overflow: hidden;
    }
    .mini-fill {
        height: 100%;
        background: #fff;
        border-radius: 2px;
        transition: width 0.25s;
    }
    .mini-value {
        color: #fff;
        font-weight: 700;
        min-width: 36px;
        text-align: right;
    }

    /* КОМПАКТНЫЕ МНОЖИТЕЛИ — в 5 раз меньше */
    .multiplier-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin-bottom: 10px;
    }
    .mult-btn {
        background: #151515;
        border: 1px solid rgba(255,255,255,0.1);
        color: #fff;
        padding: 5px 2px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
        line-height: 1.1;
    }
    .mult-btn.active {
        background: #ffffff;
        border-color: #fff;
        color: #000;
    }
    .mult-btn .chance {
        display: block;
        font-size: 7px;
        color: #888;
        font-weight: 500;
        margin-top: 1px;
    }
    .mult-btn.active .chance { color: rgba(0,0,0,0.6); }

    .action-btn {
        width: 100%;
        padding: 16px;
        background: #ffffff;
        border: none;
        border-radius: 14px;
        color: #000;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: transform 0.1s;
        margin-bottom: 12px;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.5; }

    .two-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .col-block {
        background: #151515;
        border-radius: 14px;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        max-height: 240px;
        overflow-y: auto;
    }
    .col-block h4 {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #777;
        margin-bottom: 8px;
    }
    .gift-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 8px;
        margin-bottom: 4px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        cursor: pointer;
        transition: all 0.15s;
    }
    .gift-item.active {
        border-color: #fff;
        background: rgba(255,255,255,0.08);
    }
    .gift-item img {
        width: 26px; height: 26px;
        object-fit: contain;
        flex-shrink: 0;
    }
    .gift-item .gname {
        flex: 1;
        font-size: 10px;
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .gift-item .gval {
        font-size: 10px;
        color: #fff;
        font-weight: 700;
    }

    .footer {
        text-align: center;
        margin-top: 18px;
        font-size: 10px;
        color: #555;
        padding-bottom: 10px;
    }
    .footer a { color: #fff; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
    <div class="logo">ПСЫ<span class="dot">.</span>gg</div>
    <div class="balance">⭐ <span id="balance">1000</span></div>
</div>

<div class="arena">
    <div class="item-slot" id="from-card">
        <div class="slot-title">Твой гифт</div>
        <img class="item-img" id="from-img" src="" alt="">
        <div class="item-name" id="from-name">—</div>
        <div class="item-value" id="from-value">—</div>
    </div>

    <div class="wheel-col">
        <div class="wheel-wrap">
            <svg class="wheel-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
                <path id="win-arc" fill="#fff" opacity="0.85"/>
            </svg>
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center">
                <div class="wheel-percent" id="wheel-percent">65%</div>
                <div class="wheel-chance-label" id="wheel-label">средний</div>
            </div>
        </div>

        <div class="mini-scales">
            <div class="mini-row">
                <span class="label">%</span>
                <div class="mini-bar"><div class="mini-fill" id="mini-chance-fill"></div></div>
                <span class="mini-value" id="mini-chance-val">65%</span>
            </div>
            <div class="mini-row">
                <span class="label">×</span>
                <div class="mini-bar"><div class="mini-fill" id="mini-mult-fill"></div></div>
                <span class="mini-value" id="mini-mult-val">1.5</span>
            </div>
        </div>
    </div>

    <div class="item-slot" id="to-card">
        <div class="slot-title">Цель</div>
        <img class="item-img" id="to-img" src="" alt="" style="opacity:0.35;">
        <div class="item-name" id="to-name">—</div>
        <div class="item-value" id="to-value">—</div>
    </div>
</div>

<div class="multiplier-grid" id="mult-grid"></div>

<button class="action-btn" id="upgrade-btn">Прокачать</button>

<div class="two-cols">
    <div class="col-block">
        <h4>Мои гифты</h4>
        <div id="my-gifts"></div>
    </div>
    <div class="col-block">
        <h4>Доступные цели</h4>
        <div id="target-gifts"></div>
    </div>
</div>

<div class="footer">
    powered by <a href="https://api.changes.tg" target="_blank">@GiftChanges</a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const ITEMS = [
        { api: 'Heart',       name: 'Heart',        value: 15    },
        { api: 'TeddyBear',   name: 'Teddy Bear',   value: 15    },
        { api: 'Present',     name: 'Present',      value: 25    },
        { api: 'Rose',        name: 'Rose',         value: 25    },
        { api: 'Cake',        name: 'Cake',         value: 50    },
        { api: 'Bouquet',     name: 'Bouquet',      value: 50    },
        { api: 'Rocket',      name: 'Rocket',       value: 50    },
        { api: 'Champagne',   name: 'Champagne',    value: 50    },
        { api: 'Trophy',      name: 'Trophy',       value: 100   },
        { api: 'Crown',       name: 'Crown',        value: 100   },
        { api: 'Ring',        name: 'Ring',         value: 100   },
        { api: 'Diamond',     name: 'Diamond',      value: 100   },
        { api: 'JollyChimp',  name: 'Jolly Chimp',  value: 250   },
        { api: 'PlushPepe',   name: 'Plush Pepe',   value: 500   },
        { api: 'SnoopDogg',   name: 'Snoop Dogg',   value: 1000  },
        { api: 'Papakha',     name: 'Papakha',      value: 2500  }
    ];

    const MULTIPLIERS = [
        { mult: 1.2, chance: 80 },
        { mult: 1.5, chance: 65 },
        { mult: 2.0, chance: 50 },
        { mult: 3.0, chance: 33 },
        { mult: 5.0, chance: 20 },
        { mult: 10,  chance: 10 },
        { mult: 25,  chance: 4  },
        { mult: 100, chance: 1  }
    ];

    const SPIN_DURATION = 7500; // 7.5 сек

    function giftImage(apiName, size = 128) {
        return `https://api.changes.tg/original/${apiName}.png?size=${size}`;
    }

    let balance = 1000;
    let currentItem = ITEMS[3];
    let currentMult = MULTIPLIERS[1];
    let isSpinning = false;

    const $ = id => document.getElementById(id);

    function chanceLabel(c) {
        if (c >= 60) return 'высокий';
        if (c >= 30) return 'средний';
        if (c >= 10) return 'низкий';
        return 'безумие';
    }

    function updateWinArc() {
        const arc = $('win-arc');
        const cx = 50, cy = 50;
        const half = currentMult.chance * 3.6 / 2;
        const startAngle = 180 - half;
        const endAngle = 180 + half;

        const toRad = deg => (deg * Math.PI) / 180;
        const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;

        const rOuter = 49;
        const rInner = 39;

        const xo1 = cx + rOuter * Math.sin(toRad(startAngle));
        const yo1 = cy - rOuter * Math.cos(toRad(startAngle));
        const xo2 = cx + rOuter * Math.sin(toRad(endAngle));
        const yo2 = cy - rOuter * Math.cos(toRad(endAngle));
        const xi1 = cx + rInner * Math.sin(toRad(startAngle));
        const yi1 = cy - rInner * Math.cos(toRad(startAngle));
        const xi2 = cx + rInner * Math.sin(toRad(endAngle));
        const yi2 = cy - rInner * Math.cos(toRad(endAngle));

        const d = [
            `M ${xo1} ${yo1}`,
            `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${xo2} ${yo2}`,
            `L ${xi2} ${yi2}`,
            `A ${rInner} ${rInner} 0 ${largeArc} 0 ${xi1} ${yi1}`,
            'Z'
        ].join(' ');

        arc.setAttribute('d', d);
    }

    function updatePercentUI() {
        $('wheel-percent').textContent = currentMult.chance + '%';
        $('wheel-label').textContent = chanceLabel(currentMult.chance);
        $('mini-chance-fill').style.width = currentMult.chance + '%';
        $('mini-chance-val').textContent = currentMult.chance + '%';
        $('mini-mult-fill').style.width = Math.min(100, (currentMult.mult / 100) * 100) + '%';
        $('mini-mult-val').textContent = '×' + currentMult.mult;
        updateWinArc();
    }

    function renderMultipliers() {
        const grid = $('mult-grid');
        grid.innerHTML = '';
        MULTIPLIERS.forEach((m, i) => {
            const btn = document.createElement('button');
            btn.className = 'mult-btn' + (i === 1 ? ' active' : '');
            btn.innerHTML = `×${m.mult}<span class="chance">${m.chance}%</span>`;
            btn.onclick = () => {
                if (isSpinning) return;
                document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMult = m;
                updatePercentUI();
                updatePreview();
            };
            grid.appendChild(btn);
        });
    }

    function updatePreview() {
        const targetValue = Math.round(currentItem.value * currentMult.mult);
        const targetItem = ITEMS.reduce((prev, curr) =>
            Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
        );
        $('to-img').src = giftImage(targetItem.api);
        $('to-img').style.opacity = '0.35';
        $('to-name').textContent = targetItem.name;
        $('to-value').textContent = targetItem.value + ' ⭐';
        $('to-card').className = 'item-slot';
        renderTargets();
    }

    function updateFromCard() {
        $('from-img').src = giftImage(currentItem.api);
        $('from-img').style.opacity = '1';
        $('from-name').textContent = currentItem.name;
        $('from-value').textContent = currentItem.value + ' ⭐';
        updatePreview();
    }

    function renderMyGifts() {
        const el = $('my-gifts');
        el.innerHTML = '';
        const idx = ITEMS.indexOf(currentItem);
        const pool = ITEMS.slice(Math.max(0, idx - 2), idx + 3);
        pool.forEach(it => {
            const div = document.createElement('div');
            div.className = 'gift-item' + (it === currentItem ? ' active' : '');
            div.innerHTML = `
                <img src="${giftImage(it.api, 64)}" alt="">
                <span class="gname">${it.name}</span>
                <span class="gval">${it.value}⭐</span>
            `;
            div.onclick = () => {
                if (isSpinning) return;
                currentItem = it;
                updateFromCard();
                renderMyGifts();
            };
            el.appendChild(div);
        });
    }

    function renderTargets() {
        const el = $('target-gifts');
        el.innerHTML = '';
        const idx = ITEMS.indexOf(currentItem);
        const targets = ITEMS.slice(idx + 1, idx + 6);
        targets.forEach(it => {
            const div = document.createElement('div');
            div.className = 'gift-item';
            div.innerHTML = `
                <img src="${giftImage(it.api, 64)}" alt="">
                <span class="gname">${it.name}</span>
                <span class="gval">${it.value}⭐</span>
            `;
            el.appendChild(div);
        });
    }

    function spinWheel(chance) {
        return new Promise(resolve => {
            const pointer = $('wheel-pointer');
            const half = chance * 3.6 / 2;
            const sectorStart = 180 - half;
            const sectorEnd = 180 + half;

            const wantWin = Math.random() * 100 < chance;
            let targetAngle;
            if (wantWin) {
                targetAngle = sectorStart + 1 + Math.random() * (sectorEnd - sectorStart - 2);
            } else {
                const outsideSize = 360 - (sectorEnd - sectorStart);
                let offset = 1 + Math.random() * (outsideSize - 2);
                targetAngle = sectorEnd + offset;
                if (targetAngle > 360) targetAngle -= 360;
            }

            const turns = 8 + Math.floor(Math.random() * 4); // больше оборотов за 7.5 сек
            const totalAngle = turns * 360 + targetAngle;

            pointer.style.transition = 'none';
            pointer.style.transform = 'rotate(0deg)';
            void pointer.offsetWidth;

            pointer.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.7, 0.15, 1)`;
            pointer.style.transform = `rotate(${totalAngle}deg)`;

            const finalAngle = ((totalAngle % 360) + 360) % 360;
            const realWin = finalAngle >= sectorStart && finalAngle <= sectorEnd;

            setTimeout(() => resolve(realWin), SPIN_DURATION + 100);
        });
    }

    async function doUpgrade() {
        if (isSpinning) return;

        isSpinning = true;
        $('upgrade-btn').disabled = true;
        $('to-card').className = 'item-slot';

        const targetValue = Math.round(currentItem.value * currentMult.mult);
        const win = await spinWheel(currentMult.chance);

        if (win) {
            const newItem = ITEMS.reduce((prev, curr) =>
                Math.abs(curr.value - targetValue) < Math.abs(prev.value - targetValue) ? curr : prev
            );

            $('to-img').src = giftImage(newItem.api);
            $('to-img').style.opacity = '1';
            $('to-name').textContent = newItem.name;
            $('to-value').textContent = newItem.value + ' ⭐';
            $('to-card').classList.add('win');

            tg.HapticFeedback?.notificationOccurred('success');
            currentItem = newItem;
        } else {
            $('to-img').src = giftImage(currentItem.api);
            $('to-img').style.opacity = '0.15';
            $('to-name').textContent = 'Провал';
            $('to-value').textContent = '−' + currentItem.value + ' ⭐';
            $('to-card').classList.add('lose');

            tg.HapticFeedback?.notificationOccurred('error');
            balance = Math.max(0, balance - currentItem.value);
            $('balance').textContent = balance;
        }

        setTimeout(() => {
            updateFromCard();
            renderMyGifts();
            renderTargets();
            isSpinning = false;
            $('upgrade-btn').disabled = false;
        }, 600);
    }

    renderMultipliers();
    updateFromCard();
    updatePercentUI();
    renderMyGifts();
    renderTargets();
    $('upgrade-btn').onclick = doUpgrade;
</script>
</body>
</html>
